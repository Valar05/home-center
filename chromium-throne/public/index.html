<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chromium Throne</title>
  <style>
    :root{color-scheme:dark;--ink:#f4efe8;--muted:#aaa3ad;--panel:#19171d;--line:#38313d;--ember:#dc8063;--sea:#76b9b0;--danger:#e56b72;--radius:18px;font:16px/1.45 ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#21151b,#0e0d11 40%);color:var(--ink)}header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem 1.3rem;background:#0e0d11e8;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}h1{font:600 clamp(1.2rem,3vw,2rem)/1.1 Georgia,serif;margin:0}main{padding:1.2rem;max-width:1600px;margin:auto}.legend{color:var(--muted);font-size:.85rem}.room{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,1fr);gap:1rem}.conversation,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 15px 50px #0005}.conversation{min-height:72vh;display:flex;flex-direction:column;overflow:hidden}.lanes{display:flex;gap:.4rem;overflow:auto;padding:.8rem;border-bottom:1px solid var(--line)}.lanes button[aria-selected=true]{border-color:var(--sea);background:#18302e}.transcript{padding:1rem;flex:1;overflow:auto;max-height:58vh}.message{max-width:78%;padding:.7rem .9rem;margin:.5rem 0;border-radius:16px;background:#26212a}.message.Drew{margin-left:auto;background:#382229}.message.Venice{border-left:3px solid var(--sea)}.message .speaker{color:var(--muted);font-size:.75rem}.composer{padding:.8rem;border-top:1px solid var(--line)}textarea{width:100%;min-height:90px;resize:vertical;background:#100f13;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.8rem}.grid{display:grid;gap:.8rem;align-content:start}.card{padding:1rem}.card h2{font-size:1rem;margin:.1rem 0 .3rem}.meta{display:flex;flex-wrap:wrap;gap:.4rem;color:var(--muted);font-size:.78rem}.pill{border:1px solid var(--line);border-radius:99px;padding:.2rem .5rem}.RUNNING{color:var(--sea)}.BLOCKED,.FAILED{color:var(--danger)}.summary{min-height:2.5rem}button{appearance:none;border:1px solid var(--line);border-radius:10px;background:#242029;color:var(--ink);padding:.55rem .7rem;margin:.2rem .2rem 0 0;cursor:pointer}button:hover,button:focus-visible,textarea:focus-visible{border-color:var(--ember);outline:2px solid var(--ember);outline-offset:2px}#empty{color:var(--muted);padding:4rem;text-align:center}.sr{position:absolute;clip:rect(0 0 0 0);width:1px;height:1px;overflow:hidden}@media(max-width:800px){.room{grid-template-columns:1fr}.conversation{min-height:62vh}.message{max-width:92%}}
  </style>
</head>
<body>
  <header><div><h1>Chromium Throne</h1><div class="legend">Local tabs. Visible truth. Venice governs the room.</div></div><div id="status" role="status" aria-live="polite">Connecting…</div></header>
  <main><div class="room"><section class="conversation" aria-label="Venice conversation room"><nav id="lanes" class="lanes" aria-label="Conversation nerves"></nav><div id="transcript" class="transcript" aria-live="polite"></div><form id="composer" class="composer"><label for="words">Speak to Venice or carry a command</label><textarea id="words" required placeholder="Conversation and command share the room; intent stays visible."></textarea><button name="kind" value="SOCIAL">Speak</button><button name="kind" value="COMMAND">Command</button></form></section><aside><div id="threads" class="grid" aria-label="Living worker organs"></div><div id="empty">No nerve lanes yet. The throne is breathing, waiting for a conversation.</div></aside></div></main>
  <script type="module">
    const grid=document.querySelector('#threads'),empty=document.querySelector('#empty'),status=document.querySelector('#status'),lanes=document.querySelector('#lanes'),transcript=document.querySelector('#transcript'),composer=document.querySelector('#composer');let selected=null,cache=[];
    const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    async function action(id,verb,method='POST'){await fetch(`/api/threads/${encodeURIComponent(id)}/${verb}`,{method});await refresh()}
    async function close(id){await fetch(`/api/threads/${encodeURIComponent(id)}`,{method:'DELETE'});await refresh()}
    function card(t){const el=document.createElement('article');el.className='card';el.innerHTML=`<h2>${esc(t.title)}</h2><div class="meta"><span class="pill ${esc(t.state)}">pulse: ${esc(t.state)}</span><span class="pill">${esc(t.costClass)}</span><span class="pill">nerve: ${esc(t.owner)}</span></div><p class="summary">${esc(t.summary||t.blocker||'Quiet tissue. No distress signal.')}</p><div><button data-a="screenshot">Remember view</button><button data-a="${t.state==='PAUSED'?'resume':'pause'}">${t.state==='PAUSED'?'Wake':'Rest'}</button><button data-a="close">Release</button></div>`;el.onclick=e=>{if(e.target.tagName!=='BUTTON'){selected=t.threadId;renderLanes();loadMessages()}};el.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();return b.dataset.a==='close'?close(t.threadId):action(t.threadId,b.dataset.a)});return el}
    function renderLanes(){lanes.replaceChildren(...cache.map(t=>{const b=document.createElement('button');b.textContent=t.title;b.setAttribute('aria-selected',String(t.threadId===selected));b.onclick=()=>{selected=t.threadId;renderLanes();loadMessages()};return b}))}
    async function loadMessages(){if(!selected){transcript.innerHTML='<p class="legend">Choose a nerve lane. Venice remains Venice across the parallel room.</p>';return}const r=await fetch(`/api/threads/${encodeURIComponent(selected)}/messages`),{messages}=await r.json();transcript.replaceChildren(...messages.map(m=>{const d=document.createElement('div');d.className=`message ${m.speaker}`;d.innerHTML=`<div class="speaker">${esc(m.speaker)} · ${esc(m.kind)}</div><div>${esc(m.text)}</div>`;return d}));transcript.scrollTop=transcript.scrollHeight}
    async function refresh(){const r=await fetch('/api/threads'),{threads}=await r.json();cache=threads;if(!selected&&threads[0])selected=threads[0].threadId;if(selected&&!threads.some(t=>t.threadId===selected))selected=threads[0]?.threadId??null;grid.replaceChildren(...threads.map(card));renderLanes();await loadMessages();empty.hidden=threads.length>0;status.textContent=`${threads.filter(t=>t.state==='RUNNING').length} steady · ${threads.filter(t=>t.state==='WAITING').length} listening · ${threads.length} nerves`}
    composer.onsubmit=async e=>{e.preventDefault();if(!selected)return;const submit=e.submitter;const text=document.querySelector('#words').value;await fetch(`/api/threads/${encodeURIComponent(selected)}/messages`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,kind:submit.value,humanInitiated:true})});document.querySelector('#words').value='';await refresh()};
    const events=new EventSource('/api/events');events.onmessage=refresh;events.onerror=()=>status.textContent='Event stream reconnecting…';await refresh();
  </script>
</body>
</html>
