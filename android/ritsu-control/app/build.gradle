plugins { id 'com.android.application' }

android {
    namespace 'com.homecenter.ritsucontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'com.homecenter.ritsucontrol'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.11.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
