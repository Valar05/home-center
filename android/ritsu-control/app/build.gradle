plugins { id 'com.android.application' }

// Opt-in separate package for older debug installs with unrelated signing
// certificates. Preserves the existing app's private files and conversations.
def parallelInstall = providers.gradleProperty('ritsuParallelInstall').orElse('false').get() == 'true'
// Dedicated campaign package can live beside BOTH the old app and the already
// connected v0.11 package. Never require uninstalling either to try this build.
def campaignInstall = providers.gradleProperty('ritsuCampaignInstall').orElse('false').get() == 'true'
def outboxInstall = providers.gradleProperty('ritsuOutboxInstall').orElse('false').get() == 'true'

android {
    namespace 'com.homecenter.ritsucontrol'
    compileSdk 35
    defaultConfig {
        applicationId outboxInstall ? 'com.homecenter.ritsucontrol.outbox' : (campaignInstall ? 'com.homecenter.ritsucontrol.campaign' : (parallelInstall ? 'com.homecenter.ritsucontrol.connected' : 'com.homecenter.ritsucontrol'))
        manifestPlaceholders = [ritsuAppLabel: outboxInstall ? 'Ritsu Control (Outbox)' : (campaignInstall ? 'Ritsu Control (Campaign)' : (parallelInstall ? 'Ritsu Control (Connected)' : 'Ritsu Control')), ritsuOAuthScheme: outboxInstall ? 'ritsucontroloutbox' : (campaignInstall ? 'ritsucontrolcampaign' : 'ritsucontrol')]
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.13.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
