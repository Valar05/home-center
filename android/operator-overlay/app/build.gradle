plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homecenter.operatoroverlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homecenter.operatoroverlay'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
