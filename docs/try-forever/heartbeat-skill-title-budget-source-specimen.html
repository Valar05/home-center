<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warm Wall — Skill Title Resource Throat</title>
<style>
  :root { font-family: system-ui, sans-serif; background:#15130f; color:#f7f0df; }
  body { margin:0; padding:24px; }
  main { max-width:760px; margin:auto; border:2px solid currentColor; border-radius:24px; padding:20px; }
  h1 { font-size:1.35rem; }
  .scar { border-left:6px solid currentColor; padding:12px 16px; margin:16px 0; }
  [role="radiogroup"] { display:grid; gap:12px; }
  button[role="radio"] { min-height:48px; min-width:48px; width:100%; text-align:left; padding:12px 16px; border:2px solid currentColor; border-radius:14px; background:transparent; color:inherit; font:inherit; }
  button[role="radio"]:focus-visible { outline:4px double currentColor; outline-offset:3px; }
  button[aria-checked="true"] { box-shadow:inset 0 0 0 4px currentColor; }
  #detail { min-height:7rem; white-space:pre-wrap; border:1px dashed currentColor; border-radius:14px; padding:14px; margin-top:16px; }
  .token { font-weight:800; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>WARM WALL / SKILL TITLE RESOURCE THROAT</h1>
  <p class="scar"><strong>SOURCE ONLY.</strong> Repository policy specimen; not executed probe evidence, Android runtime proof, phone delivery, or Christmas blink permission.</p>
  <div role="radiogroup" aria-label="Skill title provenance states" id="states">
    <button role="radio" aria-checked="true" tabindex="0" data-state="accepted"><span class="token">● ACCEPTED</span> — bounded UTF-8 H1</button>
    <button role="radio" aria-checked="false" tabindex="-1" data-state="line"><span class="token">× LINE BLOCKED</span> — one line exceeds 8 KiB</button>
    <button role="radio" aria-checked="false" tabindex="-1" data-state="scan"><span class="token">× SCAN BLOCKED</span> — title not resolved within 64 KiB</button>
    <button role="radio" aria-checked="false" tabindex="-1" data-state="title"><span class="token">× TITLE BLOCKED</span> — H1 exceeds 256 code points</button>
  </div>
  <div id="detail" role="status" aria-live="polite"></div>
</main>
<script>
const copy = {
  accepted: 'Why: source fits every declared resource bound.\nConsequence: repository_skill record may continue through the remaining provenance gates.\nEvidence: exact bytes + UTF-8 + bounded H1; no truncation required.',
  line: 'Why: a single source line crossed the byte throat.\nConsequence: omit the skill record; preserve structured title-stage failure and diagnostic SHA.\nEvidence: do not continue to a later plausible H1.',
  scan: 'Why: title work crossed the total scan budget.\nConsequence: omit the skill record instead of blessing a late title.\nEvidence: resource failure is not malformed UTF-8 and not a speech-budget event.',
  title: 'Why: the decoded H1 itself crossed the character budget.\nConsequence: reject; never truncate it into a plausible repository identity.\nEvidence: exact source remains evidence, but authority stays dark.'
};
const group = document.getElementById('states');
const radios = [...group.querySelectorAll('[role="radio"]')];
const detail = document.getElementById('detail');
function select(next, focus=true) {
  radios.forEach(r => { const on = r === next; r.setAttribute('aria-checked', on ? 'true' : 'false'); r.tabIndex = on ? 0 : -1; });
  detail.textContent = copy[next.dataset.state];
  if (focus) next.focus();
}
group.addEventListener('click', e => { const r=e.target.closest('[role="radio"]'); if(r) select(r,false); });
group.addEventListener('keydown', e => {
  const i=radios.indexOf(document.activeElement); if(i<0) return;
  let n=null;
  if(e.key==='ArrowDown'||e.key==='ArrowRight') n=(i+1)%radios.length;
  if(e.key==='ArrowUp'||e.key==='ArrowLeft') n=(i-1+radios.length)%radios.length;
  if(e.key==='Home') n=0; if(e.key==='End') n=radios.length-1;
  if(n!==null){ e.preventDefault(); select(radios[n]); }
});
select(radios[0],false);
</script>
</body>
</html>
