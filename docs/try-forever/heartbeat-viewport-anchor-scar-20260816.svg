<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Heartbeat viewport contact source scar</title>
  <desc id="desc">A non-raster warm-wall diagram showing one selected semantic heartbeat light staying at the same viewport offset while preceding content grows. Source policy only; runtime behavior is unproven.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: currentColor; }
      .wall { fill: none; stroke: currentColor; stroke-width: 3; }
      .wire { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 8 7; }
      .node { fill: none; stroke: currentColor; stroke-width: 3; }
      .scar { fill: none; stroke: currentColor; stroke-width: 5; }
      .tiny { font-size: 14px; }
      .label { font-size: 18px; font-weight: 700; }
      .big { font-size: 26px; font-weight: 800; }
    </style>
  </defs>

  <rect class="wall" x="28" y="32" width="904" height="292" rx="30"/>
  <text class="big" x="56" y="72">WARM WALL / VIEWPORT CONTACT</text>
  <text class="tiny" x="56" y="98">SOURCE POLICY • NOT ANDROID RUNTIME PROOF • NOT PHONE DELIVERY</text>

  <rect class="wall" x="70" y="126" width="350" height="112" rx="18"/>
  <text class="label" x="90" y="154">BEFORE</text>
  <line class="wire" x1="112" y1="193" x2="378" y2="193"/>
  <rect class="node" x="122" y="170" width="74" height="48" rx="12"/>
  <text class="tiny" x="143" y="199">A</text>
  <rect class="scar" x="226" y="170" width="118" height="48" rx="12"/>
  <text class="tiny" x="244" y="199">● SELECTED</text>
  <text class="tiny" x="90" y="260">viewport offset = 36px</text>

  <path class="wire" d="M438 193 C472 154 488 232 522 193"/>
  <text class="label" x="446" y="154">HUNGER</text>
  <text class="tiny" x="448" y="214">label grows</text>

  <rect class="wall" x="540" y="126" width="350" height="112" rx="18"/>
  <text class="label" x="560" y="154">AFTER LAYOUT</text>
  <line class="wire" x1="582" y1="193" x2="848" y2="193"/>
  <rect class="node" x="592" y="170" width="154" height="48" rx="12"/>
  <text class="tiny" x="609" y="199">A GOT WIDER</text>
  <rect class="scar" x="776" y="170" width="94" height="48" rx="12"/>
  <text class="tiny" x="786" y="199">● SAME ID</text>
  <text class="tiny" x="560" y="260">restore bounded scroll → same 36px viewport offset</text>

  <text class="tiny" x="56" y="299">SELECTED ID wins → keyboard focus fallback → stale ids produce no anchor → TalkBack focus is not inferred.</text>
</svg>
