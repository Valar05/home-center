<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRY FOREVER — Candidate File Identity Warm Wall</title>
<style>
  :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #171511; color: #f3ead7; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { font-size: clamp(1.4rem, 4vw, 2.4rem); margin: 0 0 8px; }
  .scar { border: 1px solid currentColor; padding: 10px 12px; margin: 12px 0 20px; }
  .wall { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  [role="radio"] { width: 100%; min-height: 48px; text-align: left; border: 2px solid currentColor; border-radius: 14px; background: transparent; color: inherit; padding: 14px 16px; font: inherit; cursor: pointer; }
  [role="radio"][aria-checked="true"] { outline: 4px double currentColor; outline-offset: 3px; }
  [role="radio"]:focus-visible { outline: 4px solid currentColor; outline-offset: 3px; }
  .token { display: inline-block; width: 3ch; font-weight: 800; }
  .detail { min-height: 160px; margin-top: 18px; border: 2px dashed currentColor; border-radius: 14px; padding: 16px; white-space: pre-wrap; }
  .map { width: 100%; height: 180px; margin-top: 18px; }
  .map line, .map rect, .map circle { vector-effect: non-scaling-stroke; stroke: currentColor; fill: none; stroke-width: 2; }
  .map text { fill: currentColor; font: 13px ui-monospace, monospace; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1>CANDIDATE FILE IDENTITY / WARM WALL</h1>
  <p>One named <code>SKILL.md</code> must remain one ordinary repository-owned file across the checked work.</p>
  <div class="scar">SOURCE OWNER WIRED · TOPOLOGY GATE WIRED · FILE IDENTITY BRACKET WIRED · TESTED NO · RUNTIME UNPROVEN · PHONE/P0 UNTOUCHED · STABLE OBSERVATIONS ≠ ATOMIC BINDING</div>

  <div class="wall" role="radiogroup" aria-label="Candidate file identity states" id="states">
    <button type="button" role="radio" aria-checked="true" tabindex="0" data-key="wired"><span class="token">●</span> OWNER SOURCE WIRED</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-key="stable"><span class="token">●</span> STABLE OBSERVATION</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-key="redirector"><span class="token">×</span> REDIRECTOR / NON-FILE BLOCKED</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-key="changed"><span class="token">□</span> FILE CHANGED</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-key="unknown"><span class="token">◇</span> IDENTITY UNAVAILABLE</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-key="atomic"><span class="token">!</span> ATOMICITY STILL OPEN</button>
  </div>

  <div class="detail" id="detail" aria-live="polite"></div>

  <svg class="map" viewBox="0 0 900 180" role="img" aria-labelledby="mapTitle mapDesc">
    <title id="mapTitle">Candidate file identity authority path</title>
    <desc id="mapDesc">The existing provenance owner performs no-follow candidate admission, captures candidate identity, reads bounded title and exact bounded hash, then revalidates identity. Stable revalidation is still not an atomic file-handle guarantee.</desc>
    <rect x="20" y="55" width="155" height="65" rx="12"/>
    <text x="36" y="83">NO-FOLLOW</text><text x="36" y="103">CANDIDATE</text>
    <line x1="175" y1="87" x2="240" y2="87"/>
    <circle cx="275" cy="87" r="34"/>
    <text x="248" y="84">OBSERVE</text><text x="254" y="103">IDENTITY</text>
    <line x1="309" y1="87" x2="382" y2="87"/>
    <rect x="382" y="45" width="175" height="84" rx="12"/>
    <text x="401" y="78">BOUNDED TITLE</text><text x="401" y="101">+ EXACT HASH</text>
    <line x1="557" y1="87" x2="625" y2="87"/>
    <circle cx="663" cy="87" r="34"/>
    <text x="634" y="84">REVALIDATE</text><text x="642" y="103">IDENTITY</text>
    <line x1="697" y1="87" x2="760" y2="87"/>
    <rect x="760" y="55" width="120" height="65" rx="12"/>
    <text x="777" y="83">AUTHORITY</text><text x="777" y="103">ELIGIBLE</text>
  </svg>
</main>
<script>
(() => {
  const detail = document.getElementById('detail');
  const radios = Array.from(document.querySelectorAll('[role="radio"]'));
  const copy = {
    wired: 'OWNER SOURCE WIRED\nThe existing try_forever_skill_provenance_probe now owns both the no-follow candidate topology gate and before/after candidate-file identity revalidation. No neighboring probe or controller was created.',
    stable: 'STABLE\nSame no-follow device/inode + size/mtime observation bracketed the checked work. Eligible to continue, but this is observation truth—not atomic binding.',
    redirector: 'REDIRECTOR / NON-FILE BLOCKED\nA named SKILL.md that is a symlink, redirector, directory, or other non-ordinary file fails the global candidate gate before title/hash authority. No first-path-wins alias is allowed.',
    changed: 'FILE CHANGED\nFile type, redirector state, object identity, size, or mtime changed between observations. Fail closed; no repository-skill authority.',
    unknown: 'IDENTITY UNAVAILABLE\nNo usable inode/file-index token is available. Portable revalidation cannot certify one file object, so authority stays blocked.',
    atomic: 'ATOMICITY STILL OPEN\nEqual observations cannot prove that swap-and-restore, identity reuse, or same-token content rewrite never happened between them. Do not paint STABLE green as ATOMIC.'
  };
  function select(index, moveFocus) {
    radios.forEach((radio, i) => {
      const active = i === index;
      radio.setAttribute('aria-checked', active ? 'true' : 'false');
      radio.tabIndex = active ? 0 : -1;
      if (active) detail.textContent = copy[radio.dataset.key];
    });
    if (moveFocus) radios[index].focus();
  }
  radios.forEach((radio, index) => {
    radio.addEventListener('click', () => select(index, false));
    radio.addEventListener('keydown', event => {
      let next = null;
      if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = (index + 1) % radios.length;
      if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') next = (index - 1 + radios.length) % radios.length;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = radios.length - 1;
      if (next !== null) { event.preventDefault(); select(next, true); }
    });
  });
  select(0, false);
})();
</script>
</body>
</html>
