<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warm Wall — Cross-host path privacy</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#15130f;color:#f4efe4}body{margin:0;padding:24px;min-height:100vh}.wall{max-width:760px;margin:auto;border:2px solid currentColor;border-radius:24px;padding:20px;background:linear-gradient(180deg,#2b261d,#17140f)}h1{margin-top:0;font-size:1.5rem}.scar{font-family:ui-monospace,monospace;border:1px dashed currentColor;border-radius:12px;padding:12px;margin:12px 0}.choices{display:grid;gap:10px}.choice{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;min-height:56px;padding:10px 12px;border:1px solid currentColor;border-radius:14px;cursor:pointer}.choice:focus-within{outline:3px solid currentColor;outline-offset:3px}.choice input{width:22px;height:22px}.token{font-family:ui-monospace,monospace}.detail{margin-top:18px;min-height:88px;border-top:1px solid currentColor;padding-top:14px}.dim{opacity:.78}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}</style>
</head>
<body>
<main class="wall">
<h1>Warm Wall / Cross-host Path Privacy</h1>
<p class="dim">SOURCE OWNER WIRED · regressions UNEXECUTED · TESTED NO · runtime TalkBack NO · phone/P0 untouched</p>
<div class="scar">reviewer-host syntax ≠ repository authority · owner now consumes one shared serialized-path projector</div>
<div class="choices" role="radiogroup" aria-label="Cross-host path evidence states">
<label class="choice"><input type="radio" name="state" value="relative" checked><span><strong>REPOSITORY</strong><br><span class="token">patches/C:\literal-name.patch</span></span></label>
<label class="choice"><input type="radio" name="state" value="drive"><span><strong>EXTERNAL</strong><br><span class="token">C:\Users\alice\private\receipt.json</span></span></label>
<label class="choice"><input type="radio" name="state" value="driveRelative"><span><strong>EXTERNAL</strong><br><span class="token">C:private\receipt.json</span></span></label>
<label class="choice"><input type="radio" name="state" value="rooted"><span><strong>EXTERNAL</strong><br><span class="token">\Users\alice\private\receipt.json</span></span></label>
<label class="choice"><input type="radio" name="state" value="unc"><span><strong>EXTERNAL</strong><br><span class="token">\\server\share\private\receipt.json</span></span></label>
<label class="choice"><input type="radio" name="state" value="posix"><span><strong>EXTERNAL</strong><br><span class="token">/tmp/private/receipt.json</span></span></label>
<label class="choice"><input type="radio" name="state" value="owner"><span><strong>OWNER SOURCE WIRED</strong><br>Descriptor-shadow projector consumes the existing cross-host serialized-path policy.</span></label>
</div>
<section class="detail" id="detail" aria-live="polite" aria-atomic="true"></section>
<script>
const text={
relative:'Already-authorized repository-relative identity stays repository evidence. Windows-looking characters alone do not make it external.',
drive:'A serialized Windows absolute drive path reviewed on another OS is foreign host topology. Display becomes the constant <external-path> marker.',
driveRelative:'Drive-qualified relative syntax still depends on Windows drive context. At the unresolved serialized-path boundary it fails closed as external.',
rooted:'Rooted Windows syntax carries host root context even without a drive letter. It fails closed as external until repository-relative authority is established elsewhere.',
unc:'A serialized UNC path is foreign host topology and receives the same constant non-fingerprinting external marker.',
posix:'A serialized POSIX absolute path is host topology unless current-host repository containment is established by the owning projector.',
owner:'Authenticated owner readback shows project_serialized_report_path() is now the single display policy used by the descriptor-shadow projector. This is SOURCE wiring only; regression execution, TESTED, runtime TalkBack, deployment, delivery, and acceptance remain NO.'
};
const detail=document.getElementById('detail');
function render(){const picked=document.querySelector('input[name="state"]:checked');detail.textContent=text[picked.value];}
document.querySelectorAll('input[name="state"]').forEach((input,index,all)=>{input.addEventListener('change',render);input.addEventListener('keydown',event=>{let next=null;if(event.key==='ArrowDown'||event.key==='ArrowRight')next=(index+1)%all.length;if(event.key==='ArrowUp'||event.key==='ArrowLeft')next=(index-1+all.length)%all.length;if(event.key==='Home')next=0;if(event.key==='End')next=all.length-1;if(next!==null){event.preventDefault();all[next].checked=true;all[next].focus();render();}})});render();
</script>
</main>
</body>
</html>
