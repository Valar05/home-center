<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warm Wall / Skill Provenance</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #151719; color: #f5f2e9; }
  main { max-width: 760px; margin: 0 auto; padding: 24px; }
  .wall { border: 2px solid currentColor; border-radius: 24px; padding: 20px; background: #24211f; }
  h1 { margin-top: 0; font-size: 1.35rem; }
  .scar { font-weight: 800; letter-spacing: .04em; }
  [role="radiogroup"] { display: grid; gap: 12px; margin: 18px 0; }
  [role="radio"] {
    min-height: 48px;
    min-width: 48px;
    width: 100%;
    padding: 12px 14px;
    border: 2px solid currentColor;
    border-radius: 16px;
    background: transparent;
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  [role="radio"][aria-checked="true"] { outline: 4px double currentColor; outline-offset: 3px; }
  [role="radio"]:focus-visible { outline: 4px solid currentColor; outline-offset: 3px; }
  .token { display: inline-block; width: 2.2em; font-weight: 900; }
  .detail { min-height: 9rem; border-top: 1px solid currentColor; padding-top: 16px; }
  .detail strong { display: inline-block; min-width: 8rem; }
  svg { width: 100%; height: 76px; margin-top: 14px; }
  .wire { fill: none; stroke: currentColor; stroke-width: 3; vector-effect: non-scaling-stroke; }
  .node { fill: none; stroke: currentColor; stroke-width: 3; vector-effect: non-scaling-stroke; }
  small { display: block; margin-top: 16px; line-height: 1.45; }
  @media (prefers-reduced-motion: no-preference) {
    [role="radio"] { transition: transform 120ms ease; }
    [role="radio"]:active { transform: scale(.99); }
  }
</style>
</head>
<body>
<main>
  <section class="wall" aria-labelledby="title">
    <h1 id="title">WARM WALL / SKILL PROVENANCE</h1>
    <p class="scar">ONE WOUNDED SKILL DOES NOT GET TO BURN DOWN THE CATALOG.</p>

    <svg viewBox="0 0 600 76" role="img" aria-label="Five provenance states connected across one repository scan">
      <path class="wire" d="M35 38 H565"/>
      <circle class="node" cx="65" cy="38" r="17"/>
      <rect class="node" x="166" y="21" width="34" height="34" rx="6"/>
      <path class="node" d="M283 21 L317 55 M317 21 L283 55"/>
      <path class="node" d="M418 19 L439 38 L418 57 L397 38 Z"/>
      <path class="node" d="M520 20 L548 20 L534 56 Z"/>
    </svg>

    <div id="states" role="radiogroup" aria-label="Skill provenance state">
      <button type="button" role="radio" aria-checked="true" tabindex="0" data-state="verified">
        <span class="token" aria-hidden="true">●</span><strong>VERIFIED CURRENT</strong> — direct SKILL.md + exact hash under one stable clean scan
      </button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-state="stale">
        <span class="token" aria-hidden="true">□</span><strong>STALE INDEX</strong> — discovery only; cannot earn repository_skill provenance
      </button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-state="unresolved">
        <span class="token" aria-hidden="true">×</span><strong>UNRESOLVED</strong> — required proof is missing; fail closed
      </button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-state="unstable">
        <span class="token" aria-hidden="true">◇</span><strong>UNSTABLE SNAPSHOT</strong> — HEAD or cleanliness moved while skills were being read
      </button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-state="filefault">
        <span class="token" aria-hidden="true">△</span><strong>FILE FAULT ISOLATED</strong> — one unreadable or malformed skill is rejected; healthy peers keep their evidence
      </button>
    </div>

    <div class="detail" id="detail" aria-live="polite" aria-atomic="true"></div>
    <small>SOURCE SPECIMEN ONLY · NOT OPERATOR-OVERLAY RUNTIME PROOF · NOT PHONE DELIVERY · NO AUTOPLAY · NO CHRISTMAS BLINK</small>
  </section>
</main>
<script>
(() => {
  const group = document.getElementById('states');
  const radios = [...group.querySelectorAll('[role="radio"]')];
  const detail = document.getElementById('detail');
  const states = {
    verified: {
      state: 'VERIFIED CURRENT',
      why: 'The skill resolves directly as skills/**/SKILL.md, exact bytes have a SHA-256 identity, and the same clean git HEAD brackets the scan.',
      consequence: 'The heartbeat may truthfully use repository_skill provenance for that exact admitted record.',
      evidence: 'Pre/post HEAD + pre/post clean checkout + current-tree path + exact hash. A generated index remains optional discovery evidence.',
      source: 'tools/try_forever_skill_provenance_probe.py'
    },
    stale: {
      state: 'STALE INDEX',
      why: 'The generated index has a known mismatch such as foreign HEAD, dirty source declaration, or age beyond the freshness window.',
      consequence: 'It may suggest where to look, but it cannot light a repository_skill by itself.',
      evidence: 'Mismatch remains visible instead of being normalized into current authority.',
      source: 'skills/heartbeat-skill-provenance-freshness/SKILL.md'
    },
    unresolved: {
      state: 'UNRESOLVED',
      why: 'Required provenance proof is unavailable or ambiguous: missing head, cleanliness, timestamp, or other evidence.',
      consequence: 'Fail closed. Keep the light dark or use the truthful doctrine/jar/reviewer/runtime-boundary provenance kind.',
      evidence: 'Unknown is not promoted into VERIFIED CURRENT.',
      source: 'skills/heartbeat-skill-provenance-freshness/SKILL.md'
    },
    unstable: {
      state: 'UNSTABLE SNAPSHOT',
      why: 'The repository moved while direct skill provenance was being assembled: HEAD changed, cleanliness became unavailable, or the checkout was dirty at one bracket.',
      consequence: 'Discovered hashes remain diagnostic only. They cannot certify one current repository snapshot.',
      evidence: 'Both pre-scan and post-scan repository observations remain visible; strict mode fails instead of choosing whichever observation is more convenient.',
      source: 'tools/try_forever_skill_provenance_probe.py'
    },
    filefault: {
      state: 'FILE FAULT ISOLATED',
      why: 'One SKILL.md could not be admitted because its bytes were unreadable or its title text was malformed UTF-8.',
      consequence: 'That file earns no repository_skill authority, but unrelated valid skills continue through deterministic discovery. Strict mode still fails the report when discoveryErrors exist.',
      evidence: 'A bounded structured discoveryErrors record carries path, stage, error type, fixed reason, and optional diagnostic SHA without raw exception prose.',
      source: 'tools/try_forever_skill_provenance_probe.py + skills/heartbeat-skill-provenance-freshness/SKILL.md'
    }
  };

  function render(button, announce = true) {
    const item = states[button.dataset.state];
    radios.forEach(radio => {
      const selected = radio === button;
      radio.setAttribute('aria-checked', String(selected));
      radio.tabIndex = selected ? 0 : -1;
    });
    detail.replaceChildren();
    const rows = [
      ['State', item.state],
      ['Why', item.why],
      ['Consequence', item.consequence],
      ['Evidence', item.evidence],
      ['Source', item.source]
    ];
    rows.forEach(([label, value]) => {
      const p = document.createElement('p');
      const strong = document.createElement('strong');
      strong.textContent = label + ':';
      p.append(strong, document.createTextNode(' ' + value));
      detail.appendChild(p);
    });
    if (!announce) detail.setAttribute('aria-live', 'off');
    requestAnimationFrame(() => detail.setAttribute('aria-live', 'polite'));
  }

  radios.forEach((radio, index) => {
    radio.addEventListener('click', () => render(radio));
    radio.addEventListener('keydown', event => {
      let next = index;
      if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = (index + 1) % radios.length;
      else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') next = (index - 1 + radios.length) % radios.length;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = radios.length - 1;
      else return;
      event.preventDefault();
      radios[next].focus();
      render(radios[next]);
    });
  });

  render(radios[0], false);
})();
</script>
</body>
</html>
