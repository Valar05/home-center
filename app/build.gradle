import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def localProps = new java.util.Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream ->
        localProps.load(stream)
    }
}

def geminiApiKey = localProps.getProperty("GEMINI_API_KEY", "")
def openAiApiKey = localProps.getProperty("OPENAI_API_KEY", System.getenv("OPENAI_API_KEY") ?: "")
def cartesiaApiKey = localProps.getProperty("CARTESIA_API_KEY", System.getenv("CARTESIA_API_KEY") ?: "")
def geminiModel = localProps.getProperty("GEMINI_MODEL", "gemini-2.0-flash")
def firebaseProjectId = ""
def googleServicesFile = project.file("google-services.json")
if (googleServicesFile.exists()) {
    def googleServices = new JsonSlurper().parse(googleServicesFile)
    firebaseProjectId = googleServices.project_info?.project_id ?: ""
}
def defaultAgentGatewayBaseUrl = firebaseProjectId.isEmpty() ? "" : "https://us-central1-${firebaseProjectId}.cloudfunctions.net"
def agentGatewayBaseUrl = localProps.getProperty("AGENT_GATEWAY_BASE_URL", defaultAgentGatewayBaseUrl)
def cartesiaProxyBaseUrl = localProps.getProperty("CARTESIA_PROXY_BASE_URL", agentGatewayBaseUrl.isEmpty() ? "http://localhost:8787" : agentGatewayBaseUrl)

android {
    namespace 'com.dclar.homecenter'
    compileSdk 33

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.dclar.homecenter'
        minSdk 26
        targetSdk 33
        versionCode 60
        versionName '0.2.56'

        buildConfigField 'String', 'GEMINI_API_KEY', "\"${geminiApiKey.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField 'String', 'OPENAI_API_KEY', "\"${openAiApiKey.replace('\\', '\\\\').replace('\"', '\\"')}\""
        buildConfigField 'String', 'CARTESIA_API_KEY', "\"${cartesiaApiKey.replace('\\', '\\\\').replace('\"', '\\"')}\""
        buildConfigField 'String', 'GEMINI_MODEL', "\"${geminiModel.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField 'String', 'AGENT_GATEWAY_BASE_URL', "\"${agentGatewayBaseUrl.replace('\\', '\\\\').replace('\"', '\\"')}\""
        buildConfigField 'String', 'CARTESIA_PROXY_BASE_URL', "\"${cartesiaProxyBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    testImplementation 'junit:junit:4.13.2'
}
