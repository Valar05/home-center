<script>
const B=s=>Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));
async function G(id){const ds=new DecompressionStream('gzip');const r=new Response(new Blob([B(document.getElementById(id).textContent)]).stream().pipeThrough(ds));return await r.text()}
Promise.all([G('gz-a'),G('gz-j')]).then(([a,j])=>{document.getElementById('a').textContent=a;document.getElementById('j').textContent=j});
document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active')});
</script></body></html>
