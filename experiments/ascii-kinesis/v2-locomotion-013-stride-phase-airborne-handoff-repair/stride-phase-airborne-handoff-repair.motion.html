function lp(a,b){let[x0,y0]=a,[x1,y1]=b,dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,e=dx+dy,p=[];for(;;){p.push([x0,y0]);if(x0===x1&&y0===y1)return p;let q=2*e;if(q>=dy){e+=dy;x0+=sx}if(q<=dx){e+=dx;y0+=sy}}}function art(M,j,s){let[W,H]=M.rig.canvas,G=M.rig.ground_y,g=Array.from({length:H},()=>Array(W).fill(' '));for(let x=0;x<W;x++)g[G][x]='=';for(const[a,b]of M.rig.bones){let pa=j[a],pb=j[b];for(const[x,y]of lp(pa,pb).slice(1,-1))if(x>=0&&x<W&&y>=0&&y<H&&g[y][x]===' '){let dx=pb[0]-pa[0],dy=pb[1]-pa[1];g[y][x]=dy===0?'-':dx===0?'|':dx*dy>0?'\\':'/'}}for(const[n,p]of Object.entries(j)){let[x,y]=p;if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=n==='head'?'O':n==='chest'?'+':n==='pelvis'?'@':n.includes('elbow')||n.includes('knee')?'o':'*'}let q=new Set(s.split('+'));for(const[st,n]of[['LEFT_SUPPORT','l_foot'],['RIGHT_SUPPORT','r_foot']])if(q.has(st)){let[x,y]=j[n];g[y][x]='!'}for(const[st,n]of[['LEFT_PROBE','l_foot'],['RIGHT_PROBE','r_foot']])if(q.has(st)){let[x,y]=j[n];g[y][x]='?'}return g.map(r=>r.join('').replace(/ +$/,'')).join('\n')}function sheet(M){let o=[M.title,'Legend: ! trusted support   ? probe only   @ pelvis/root   + chest   = ground',''];for(const k of M.keys)o.push(`${k.key_id} ${k.name}  [${k.timing_class} / ${k.timing_provenance}]  SUPPORT=${k.support_contact}`,'ROOT: '+k.motion_arc_root_note,'ROLE: '+k.causal_role,'ATTITUDE: '+k.attitude,'',art(M,k.joints,k.support_contact),'','');return o.join('\n').replace(/\s+$/,'')+'\n'}
async function init(){const gz=Uint8Array.from(atob(J),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const raw=await new Response(new Blob([gz]).stream().pipeThrough(ds)).text();const M=JSON.parse(raw);ap.textContent=sheet(M);jp.textContent=JSON.stringify(M,null,2);vid.src='data:video/mp4;base64,'+V.join('')}init();for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{for(const s of document.querySelectorAll('section'))s.classList.remove('active');document.getElementById(b.dataset.view).classList.add('active')};
