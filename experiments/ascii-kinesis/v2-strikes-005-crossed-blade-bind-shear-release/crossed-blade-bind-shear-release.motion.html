async function gunzip64(s){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
function line(a,b){let[x0,y0]=a.map(Math.round),[x1,y1]=b.map(Math.round),dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,e=dx+dy,o=[];for(;;){o.push([x0,y0]);if(x0===x1&&y0===y1)return o;let e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function lc(a,b){let dx=b[0]-a[0],dy=b[1]-a[1];if(Math.abs(dx)>=2*Math.abs(dy))return"-";if(Math.abs(dy)>=2*Math.abs(dx))return"|";return dx*dy>0?"\\":"/"}
function frame(m,k){let W=m.rig.grid.width,H=m.rig.grid.height,g=Array.from({length:H},()=>Array(W).fill(" ")),j=k.joints;for(let x=0;x<W;x++)g[20][x]=".";for(let[x,y]of line(j.opp_top,j.opp_bottom))if(x>=0&&x<W&&y>=0&&y<H)g[y][x]="/";for(let[a,b]of m.rig.bones){let c=lc(j[a],j[b]);for(let[x,y]of line(j[a],j[b]))if(x>=0&&x<W&&y>=0&&y<H&&g[y][x]===" ")g[y][x]=c}for(let[x,y]of line(j.rear_hand,j.reserve_tip))if(x>=0&&x<W&&y>=0&&y<H)g[y][x]="-";for(let[x,y]of line(j.front_hand,j.lead_tip))if(x>=0&&x<W&&y>=0&&y<H)g[y][x]="=";for(let[n,s]of Object.entries({head:"O",pelvis:"+",rear_hand:"o",front_hand:"o",rear_foot:"_",front_foot:"_",lead_tip:">",reserve_tip:"<"})){let[x,y]=j[n].map(Math.round);if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=s}if(k.contact_state==="BIND"){let[x,y]=j.bind_point.map(Math.round);if(x>=0&&x<W&&y>=0&&y<H)g[y][x]="X"}return g.map(r=>r.join("")).join("\n")}
function sheet(m){let p=["ASCII KINESIS V2 STRIKES 005 — CROSSED-BLADE BIND / SHEAR RELEASE","FRESH POST-DEBT CONCEPT | PRE-RESET STRIKES DEBT CLOSED BY ISSUE #343 5592566123 + 5593289237","SOURCE FAMILY: TSR asset 216526 — Two-swords Pirate — Cutthroat Island — SNES","EVIDENCE RECEIPT: issue #343 comment 5574428935 | whole-raster evidence; OBSERVED timing NONE","RIGHTS: copyright-restricted whole-sheet evidence only; independent abstract ASCII rig; no source pixels.","TIMING: every decisive key below is INFERRED; ONES/TWOS/FOURS are display-frame hold classes, not seconds.","MOTION DUNGEON: AUTHORED ASCII KEYS -> EXPLICIT HOLDS -> DETERMINISTIC CONNECTIVE MOTION -> ASCII-ONLY VIDEO","LEGEND: = lead blade | - reserve blade | / abstract opposing blade | X bind relationship point",""];for(let k of m.keys)p.push(`${k.key_id} ${k.name} | ${k.timing_class}/${k.timing_provenance} | ${k.support_contact} | contact=${k.contact_state}`,`ROLE: ${k.causal_role}`,`ROOT/ARC: ${k.motion_arc_root_note}`,frame(m,k),"");return p.join("\n").trimEnd()+"\n"}
