main:
  params: [args]
  steps:
    - validate:
        switch:
          - condition: ${not("sourceUrl" in args)}
            raise: "sourceUrl is required"
          - condition: ${not("outputFolderId" in args)}
            raise: "outputFolderId is required"
    - initializeInputs:
        assign:
          - scanMode: ${default(map.get(args, "mode"), "perceptual")}
          - scanThreshold: ${default(map.get(args, "distanceThreshold"), 6)}
    - scanVideo:
        call: http.post
        args:
          url: ${sys.get_env("MOTION_SCANNER_URL") + "/scan"}
          auth:
            type: OIDC
          timeout: 1800
          body:
            sourceUrl: ${args.sourceUrl}
            scanId: ${default(map.get(args, "scanId"), sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID"))}
            mode: ${scanMode}
            distanceThreshold: ${scanThreshold}
        result: scanResponse
    - createDocument:
        call: http.post
        args:
          url: "https://docs.googleapis.com/v1/documents"
          auth:
            type: OAuth2
            scopes:
              - "https://www.googleapis.com/auth/documents"
              - "https://www.googleapis.com/auth/drive"
          body:
            title: ${"Motion Scan " + scanResponse.body.scanId}
        result: documentResponse
    - writeMetadata:
        call: http.post
        args:
          url: ${"https://docs.googleapis.com/v1/documents/" + documentResponse.body.documentId + ":batchUpdate"}
          auth:
            type: OAuth2
            scopes:
              - "https://www.googleapis.com/auth/documents"
              - "https://www.googleapis.com/auth/drive"
          body:
            requests:
              - insertText:
                  location:
                    index: 1
                  text: '${"Motion-to-Docs Scan\nScan ID: " + scanResponse.body.scanId + "\nSource SHA-256: " + scanResponse.body.sourceSha256 + "\nMode: " + scanResponse.body.mode + "\nUnique frames: " + string(scanResponse.body.uniqueFrames) + " of " + string(scanResponse.body.totalFrames) + "\nDuplicate frames collapsed: " + string(scanResponse.body.duplicateFrames) + "\nDistance threshold: " + string(scanResponse.body.distanceThreshold) + "\n\n"}'
        result: metadataResponse
    - initializeSheets:
        assign:
          - sheetNumber: 0
    - appendContactSheets:
        for:
          value: artifact
          in: ${scanResponse.body.artifacts}
          steps:
            - sheetOnly:
                switch:
                  - condition: ${text.match_regex(artifact.object, ".*contact_sheet_[0-9]+[.]jpg$")}
                    steps:
                      - incrementSheet:
                          assign:
                            - sheetNumber: ${sheetNumber + 1}
                      - appendSheet:
                          call: http.post
                          args:
                            url: ${"https://docs.googleapis.com/v1/documents/" + documentResponse.body.documentId + ":batchUpdate"}
                            auth:
                              type: OAuth2
                              scopes:
                                - "https://www.googleapis.com/auth/documents"
                                - "https://www.googleapis.com/auth/drive"
                            body:
                              requests:
                                - insertText:
                                    endOfSegmentLocation: {}
                                    text: ${"Contact sheet " + string(sheetNumber) + "\n"}
                                - insertInlineImage:
                                    endOfSegmentLocation: {}
                                    uri: ${artifact.signedUrl}
                                    objectSize:
                                      width:
                                        magnitude: 7.0
                                        unit: "IN"
                                - insertText:
                                    endOfSegmentLocation: {}
                                    text: "\n\n"
                          result: sheetWriteResponse
    - moveDocument:
        call: http.patch
        args:
          url: ${"https://www.googleapis.com/drive/v3/files/" + documentResponse.body.documentId}
          query:
            addParents: ${args.outputFolderId}
            fields: "id,parents,webViewLink"
          auth:
            type: OAuth2
            scopes:
              - "https://www.googleapis.com/auth/drive"
        result: driveResponse
    - returnResult:
        return:
          scanId: ${scanResponse.body.scanId}
          mode: ${scanResponse.body.mode}
          totalFrames: ${scanResponse.body.totalFrames}
          uniqueFrames: ${scanResponse.body.uniqueFrames}
          duplicateFrames: ${scanResponse.body.duplicateFrames}
          document:
            documentId: ${documentResponse.body.documentId}
            webViewLink: ${driveResponse.body.webViewLink}
          artifacts: ${scanResponse.body.artifacts}
