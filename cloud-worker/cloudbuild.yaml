substitutions:
  _IMAGE: us-central1-docker.pkg.dev/home-center-dclar/command-center-workers/debian-codex:latest
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "cloud-worker/Dockerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
images:
  - "${_IMAGE}"
