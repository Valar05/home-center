name: Fortress Online V2 Contract

on:
  push:
    branches: [fortress-online-v2]
    paths:
      - 'functions/fortress_v2*'
      - 'tools/fortress_online_v2_boot*'
      - 'tools/fortress_v2_shadow_acceptance.mjs'
      - '.github/workflows/fortress-v2-contract.yml'
      - 'docs/FORTRESS_ONLINE_V2*.md'
  pull_request:
    paths:
      - 'functions/fortress_v2*'
      - 'tools/fortress_online_v2_boot*'
      - 'tools/fortress_v2_shadow_acceptance.mjs'
      - '.github/workflows/fortress-v2-contract.yml'
      - 'docs/FORTRESS_ONLINE_V2*.md'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: .
        run: |
          node --check functions/fortress_v2.js
          node --check functions/fortress_v2.test.js
          node --check functions/fortress_v2_incidents.test.js
          node --check functions/fortress_v2_learning.js
          node --check functions/fortress_v2_learning.test.js
          node --check functions/fortress_v2_request_budget.js
          node --check functions/fortress_v2_request_budget.test.js
          node --check tools/fortress_online_v2_boot.mjs
          node --check tools/fortress_online_v2_boot.test.mjs
          node --check tools/fortress_v2_shadow_acceptance.mjs
      - name: Run deterministic V2 suites
        working-directory: .
        run: |
          for t in \
            functions/fortress_v2.test.js \
            functions/fortress_v2_incidents.test.js \
            functions/fortress_v2_learning.test.js \
            functions/fortress_v2_request_budget.test.js \
            tools/fortress_online_v2_boot.test.mjs
          do
            node --test "$t"
          done
          node tools/fortress_v2_shadow_acceptance.mjs
