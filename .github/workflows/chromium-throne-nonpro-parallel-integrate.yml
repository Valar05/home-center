name: Chromium Throne Non-Pro Parallel Swarm Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chromium-throne-nonpro-parallel-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chromium-throne-nonpro-parallel-integrate
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded non-Pro swarm patch
        run: node tools/apply_chromium_throne_nonpro_parallel_patch.mjs
      - name: Normalize generated assertions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'browser-porch/extension/throne_context.test.mjs';
          let t = fs.readFileSync(p, 'utf8');
          const stale = `, () => {\n  assert.equal(manifest.version, '0.7.0');\n  assert.ok(manifest.permissions.includes('tabs'));\n  assert.match(manifest.description, /single persistent ChatGPT Pro/i);\n  assert.match(manifest.key, /^MIIB/);\n  assert.equal(manifest.background.type, 'module');\n});`;
          if (!t.includes(stale)) throw new Error('superseded manifest assertion tail not found');
          t = t.replace(stale, '');
          const brittle = "  assert.match(core, /workerMode = independentRelay ? 'independent'/);";
          const fixed = "  assert.match(core, /const workerMode = independentRelay/);";
          if (!t.includes(brittle)) throw new Error('brittle workerMode assertion not found');
          t = t.replace(brittle, fixed);
          fs.writeFileSync(p, t, 'utf8');
          NODE
      - name: Syntax
        run: |
          node --check browser-porch/extension/service-worker.js
          node --check browser-porch/extension/throne-panel.mjs
          node --check browser-porch/extension/swarm-core.mjs
          node --check browser-porch/extension/swarm-core.test.mjs
          node --check browser-porch/extension/throne_context.test.mjs
      - name: Throne behavior
        run: |
          node --test browser-porch/extension/swarm-core.test.mjs
          node --test browser-porch/extension/throne_context.test.mjs
      - name: Contract assertions
        run: |
          grep -q "MAX_PARALLEL_WORKERS = 4" browser-porch/extension/swarm-core.mjs
          grep -q "WORKER_REASONING_MODE = 'high-inference non-Pro'" browser-porch/extension/swarm-core.mjs
          grep -q "creditBearingComputeAllowed: false" browser-porch/extension/swarm-core.mjs
          grep -q "const independentRelay = source === 'atom-relay'" browser-porch/extension/swarm-core.mjs
          grep -q "workerMode === 'independent'" browser-porch/extension/service-worker.js
          grep -q "maxParallelWorkers: MAX_PARALLEL_WORKERS" browser-porch/extension/service-worker.js
          grep -q "bounded high-inference non-Pro" browser-porch/extension/manifest.json
          ! grep -q "Use Pro reasoning" browser-porch/extension/service-worker.js
          ! grep -q "single persistent ChatGPT Pro-reasoning worker" browser-porch/extension/service-worker.js
          ! grep -q "same Pro worker conversation" browser-porch/extension/swarm-core.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Land tested source and remove one-use scaffolding
        run: |
          git config user.name 'home-center-actions'
          git config user.email 'home-center-actions@users.noreply.github.com'
          rm tools/apply_chromium_throne_nonpro_parallel_patch.mjs
          rm .github/workflows/chromium-throne-nonpro-parallel-integrate.yml
          git add -A
          git commit -m 'Run Chromium Throne workers concurrently without Pro compute'
          git push origin HEAD:main
