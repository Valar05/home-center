name: Deploy Ritsu Repertoire Node24
on:
  workflow_dispatch:
    inputs:
      confirm:
        required: true
        type: string
        description: Type deploy
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-home-center-mcp
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: home-center-dclar
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Verify voice integration
        run: |
          node --check functions/ritsu_voice_api.js
          node --test functions/ritsu_voice_api.test.js
          python -m unittest discover -s workers -p test_ritsu_warm_ticket_worker.py
          node -e "const x=require('./functions/ritsu_voice_profiles.json');if(Object.keys(x.profiles).length!==6)process.exit(1)"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare isolated Node24 source with unchanged production JS
        run: |
          cp -a functions "$RUNNER_TEMP/ritsu-functions-node24"
          node - "$RUNNER_TEMP/ritsu-functions-node24/package.json" <<'JS'
          const fs=require('fs'),p=process.argv[2],j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.engines={node:'24'};
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          JS
      - name: Publish Ritsu voice endpoint on Node24
        run: |
          gcloud functions deploy ritsuVoice --gen2 --project="$PROJECT" --region="$REGION" \
            --runtime=nodejs24 --source="$RUNNER_TEMP/ritsu-functions-node24" \
            --entry-point=ritsuVoice --trigger-http --allow-unauthenticated \
            --timeout=60s --memory=1Gi --cpu=1
      - name: Verify live voice handler
        run: |
          curl -fsS "https://${REGION}-${PROJECT}.cloudfunctions.net/ritsuVoice/health" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{let j=JSON.parse(s);if(!j.ok||j.service!=="ritsu-voice")process.exit(1);console.log("VOICE_HEALTH_OK")})'
      - name: Verify voice function
        run: gcloud functions describe ritsuVoice --gen2 --project="$PROJECT" --region="$REGION" --format='value(state,serviceConfig.uri)'
