name: Diagnose Ritsu Cloud Run Boot
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read error logs for failed ritsuvoice revision
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="ritsuvoice" AND resource.labels.revision_name="ritsuvoice-00002-joc"' --project=home-center-dclar --limit=18 --format='value(textPayload)' --freshness=2h | tail -c 11000
