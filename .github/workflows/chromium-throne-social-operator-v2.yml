name: Chromium Throne social operator v2

on:
  push:
    branches:
      - fortress/chromium-throne-social-operator-v2
  pull_request:
    paths:
      - 'functions/browser_social_operator.js'
      - 'functions/browser_social_operator.test.js'
      - 'functions/browser_nerve_api.js'
      - 'functions/home_center_mcp.js'
      - 'browser-nerve/windows/browser-action.mjs'
      - 'contracts/home-center-top-level-mcp.v1.json'
      - 'contracts/home-center-public-tool-manifest.v1.json'
      - 'skills/chromium-throne-social-operator/SKILL.md'
      - 'tools/apply_chromium_throne_social_operator_patch.mjs'
      - 'tools/chromium_throne_social_operator_contract_test.mjs'
      - '.github/workflows/chromium-throne-social-operator-v2.yml'

permissions:
  contents: write

concurrency:
  group: chromium-throne-social-operator-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Home Center function dependencies
        run: npm ci --prefix functions
      - name: Apply bounded source patch twice
        run: |
          node tools/apply_chromium_throne_social_operator_patch.mjs
          node tools/apply_chromium_throne_social_operator_patch.mjs
      - name: Regenerate Home Center operation manifest
        run: |
          node tools/generate_home_center_public_manifest.mjs
          node tools/generate_home_center_public_manifest.mjs --check
      - name: Static checks
        run: |
          node --check functions/browser_social_operator.js
          node --check functions/browser_nerve_api.js
          node --check functions/home_center_mcp.js
          node --check browser-nerve/windows/browser-action.mjs
          node --check tools/chromium_throne_social_operator_contract_test.mjs
          git diff --check
      - name: Browser Nerve and Home Center contracts
        run: |
          node --test functions/browser_social_operator.test.js functions/browser_nerve_api.test.js functions/browser_nerve_home_center_ops.test.js
          node tools/chromium_throne_social_operator_contract_test.mjs
      - name: Commit generated bounded patch to implementation branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo 'Source already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire social job state into current Home Center registry'
          git push origin HEAD:${{ github.ref_name }}
