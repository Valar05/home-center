name: Patch Drive Text Capability

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-drive-text-capability
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register drive_text_patch from proven source anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('functions/home_center_mcp.js')
          source = path.read_text(encoding='utf-8')

          import_line = "const {driveTextPatchOperation} = require('./drive_text_patch_service');"
          if import_line not in source:
              marker = "} = require('./drive_binary_read_service');"
              if source.count(marker) != 1:
                  raise SystemExit(f'drive binary import marker count was {source.count(marker)}, expected 1')
              source = source.replace(marker, marker + "\n" + import_line, 1)

          if not re.search(r"(?m)^[ \t]*drive_text_patch[ \t]*:", source):
              binary_entry = re.search(r"(?m)^(?P<indent>[ \t]*)drive_binary_read_begin[ \t]*:", source)
              if not binary_entry:
                  raise SystemExit('drive_binary_read_begin registry entry not found')
              indent = binary_entry.group('indent')
              entry = (
                  indent
                  + "drive_text_patch: {\n"
                  + indent + "  summary: 'Patch bounded UTF-8 bytes in place on an existing stored Drive file with expected SHA-256, exact or marker-bounded replacements, protected-region invariants, audit, and whole-file readback verification.',\n"
                  + indent + "  write: true,\n"
                  + indent + "  requiresRequestId: true,\n"
                  + indent + "  requiredScopes: ['https://www.googleapis.com/auth/drive'],\n"
                  + indent + "  input: {fileId: 'string', expectedSha256: '64-char SHA-256', expectedMimeType: 'optional MIME type', approved: 'boolean true', replacements: 'array of exact|between patch objects', protectedRegions: 'optional marker-region array', requestId: 'string', callerNote: 'optional string'},\n"
                  + indent + "},\n"
              )
              source = source[:binary_entry.start()] + entry + source[binary_entry.start():]

          if "if (operation === 'drive_text_patch')" not in source:
              marker = "  if (operation === 'drive_binary_read_begin') {\n"
              if source.count(marker) != 1:
                  raise SystemExit(f'drive binary dispatcher marker count was {source.count(marker)}, expected 1')
              block = (
                  "  if (operation === 'drive_text_patch') {\n"
                  "    const result = await driveTextPatchOperation({google, admin, auth, user, args: operationArgs});\n"
                  "    return {operation, registryVersion: registry.version, completed: true, result};\n"
                  "  }\n"
              )
              source = source.replace(marker, block + marker, 1)

          if source.count(import_line) != 1:
              raise SystemExit('driveTextPatchOperation import is not unique')
          if source.count("if (operation === 'drive_text_patch')") != 1:
              raise SystemExit('drive_text_patch dispatcher is not unique')
          if len(re.findall(r"(?m)^[ \t]*drive_text_patch[ \t]*:", source)) != 1:
              raise SystemExit('drive_text_patch registry entry is not unique')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify targeted capability
        shell: bash
        run: |
          cd functions
          node --check drive_text_patch_service.js
          node --check home_center_mcp.js
          node --test drive_text_patch_service.test.js
          grep -n -A6 -B2 "drive_text_patch" home_center_mcp.js

      - name: Commit registration and remove one-use scaffolding
        shell: bash
        run: |
          git config user.name "Home Center"
          git config user.email "home-center@users.noreply.github.com"
          rm -f .github/workflows/patch-drive-text-capability.yml diagnostics/drive-text-patch-source-context.txt
          git add -A functions/home_center_mcp.js functions/drive_text_patch_service.js functions/drive_text_patch_service.test.js .github/workflows/patch-drive-text-capability.yml diagnostics || true
          if git diff --cached --quiet; then
            echo "No patch changes produced" >&2
            exit 1
          fi
          git commit -m "Register audited in-place Drive text patch"
          git push origin HEAD:main
