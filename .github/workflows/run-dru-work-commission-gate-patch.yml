name: Run DRU Work Commission Gate Patch

on:
  push:
    paths:
      - '.github/workflows/run-dru-work-commission-gate-patch.yml'
      - 'tools/patch_dru_work_commission_gate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-dru-work-commission-gate-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm --prefix functions ci

      - name: Apply deterministic DRU patch
        run: python tools/patch_dru_work_commission_gate.py

      - name: Refresh public MCP contracts
        run: node tools/generate_home_center_public_manifest.mjs

      - name: Validate doctrine and work primitive
        run: |
          python -m py_compile tools/patch_dru_work_commission_gate.py
          node --check functions/home_center_fortress.js
          node --check functions/home_center_mcp.js
          node --check functions/index.js
          node --test functions/home_center_fortress.test.js
          node tools/generate_home_center_public_manifest.mjs --check
          grep -q "Fortress Online is always active" skills/dru-simulation-trap/SKILL.md
          grep -q "home_center_work_request" .continue/rules/05-judgement-jar-simulation-trap.md
          grep -q "AWAITING_ANSWER" functions/home_center_fortress.js
          git diff --check

      - name: Commit DRU commission gate
        run: |
          if git diff --quiet; then
            echo 'DRU commission gate already current'
            exit 0
          fi
          git config user.name 'home-center-dru-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            functions/home_center_fortress.js \
            functions/home_center_fortress.test.js \
            functions/home_center_mcp.js \
            functions/index.js \
            skills/dru-simulation-trap/SKILL.md \
            .continue/rules/05-judgement-jar-simulation-trap.md \
            contracts/home-center-top-level-mcp.v1.json \
            contracts/home-center-public-tool-manifest.v1.json
          git commit -m 'Make interrogation the atomic DRU work gate'
          git push origin HEAD:main
