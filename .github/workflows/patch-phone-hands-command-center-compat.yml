name: Patch Phone Hands Command Center Compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-phone-hands-command-center-compat
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Add phone_hands operations to Command Center dispatcher
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/command_center_mcp.js';
          let text = fs.readFileSync(path, 'utf8');
          const oldImport = "const {registerCommandCenterPhoneTools} = require('./phone_hands_relay');";
          const newImport = "const {registerCommandCenterPhoneTools, enqueuePhoneCommand, getPhoneCommand, listPhoneDevices} = require('./phone_hands_relay');";
          if (!text.includes(newImport)) {
            if (!text.includes(oldImport)) throw new Error('phone_hands_relay import anchor missing');
            text = text.replace(oldImport, newImport);
          }
          const anchor = "    case 'browser_sessions.create':\n      return createBrowserSession(admin, await caller(), args || {});";
          const insertion = "    case 'phone_hands.devices':\n      return listPhoneDevices(admin, await caller());\n    case 'phone_hands.enqueue':\n      return enqueuePhoneCommand(admin, await caller(), args || {});\n    case 'phone_hands.get':\n      return getPhoneCommand(admin, await caller(), args || {});\n" + anchor;
          if (!text.includes("case 'phone_hands.devices':")) {
            if (!text.includes(anchor)) throw new Error('command center dispatcher anchor missing');
            text = text.replace(anchor, insertion);
          }
          fs.writeFileSync(path, text);
          NODE
      - name: Add phone_hands operations to Home Center compatibility registry
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'functions/home_center_mcp.js';
          let text = fs.readFileSync(path, 'utf8');
          const anchor = "      'browser_sessions.create': {summary: 'Create a Playwright desktop Chromium browser-hands session.', readOnly: false, input: {intent: 'string', startUrl: 'optional string', surface: 'optional object', idempotencyKey: 'string'}},";
          const insertion = [
            "      'phone_hands.devices': {summary: 'List owner-scoped Android Phone Hands relay devices and last-seen state.', readOnly: true, input: {}},",
            "      'phone_hands.enqueue': {summary: 'Enqueue a bounded Android Phone Hands action for an owner-scoped device.', readOnly: false, input: {idempotencyKey: 'string', deviceId: 'optional string default primary-phone', commandId: 'optional string', action: 'object', ttlMs: 'optional number'}},",
            "      'phone_hands.get': {summary: 'Read status, result, or failure for one owner-scoped Phone Hands command.', readOnly: true, input: {commandId: 'string'}},",
            anchor,
          ].join('\n');
          if (!text.includes("'phone_hands.devices':")) {
            if (!text.includes(anchor)) throw new Error('home center command center registry anchor missing');
            text = text.replace(anchor, insertion);
          }
          fs.writeFileSync(path, text);
          NODE
      - name: Validate
        run: |
          node --check functions/command_center_mcp.js
          node --check functions/home_center_mcp.js
          node --check functions/phone_hands_relay.js
          python -m py_compile tools/android_phone_home_center_relay.py tools/android_phone_termux_shell.py
          node tools/phone_hands_relay_contract_test.mjs
          node tools/phone_shell_overlay_gate_contract_test.mjs
          git diff --check
      - name: Commit compatibility fix
        run: |
          if git diff --quiet; then
            echo 'compatibility dispatcher already current'
            exit 0
          fi
          git config user.name 'home-center-phone-hands-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add functions/command_center_mcp.js functions/home_center_mcp.js
          git commit -m 'Expose Phone Hands through Home Center dispatcher'
          git push origin HEAD:main
