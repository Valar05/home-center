name: Purge Actions Artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/purge-actions-artifacts.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PURGE_ALL to delete every Actions artifact in this repository
        required: true
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  purge:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'PURGE_ALL' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete every repository Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')"
          count="$(printf '%s\n' "$artifact_ids" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [[ -n "$artifact_ids" ]]; then
            while IFS= read -r artifact_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done <<< "$artifact_ids"
          fi

          remaining="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq '.total_count')"
          {
            echo "## Actions artifact purge"
            echo
            echo "- Deleted: ${count}"
            echo "- Remaining: ${remaining}"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$remaining" = "0"
