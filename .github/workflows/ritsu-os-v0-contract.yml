name: Ritsu OS v0 Contract

on:
  push:
    branches:
      - ritsu-os-v0
    paths:
      - config/ritsu-os.v0.json
      - fixtures/ritsu-continuity/**
      - tools/ritsu_context_router.py
      - tools/test_ritsu_context_router.py
      - tools/ritsu_primary_gate.py
      - tools/test_ritsu_primary_gate.py
      - tools/ritsu_surface_gate.py
      - tools/test_ritsu_surface_gate.py
      - .github/workflows/ritsu-os-v0-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritsu-os-v0-contract
  cancel-in-progress: true

jobs:
  deterministic-contract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refuse the wrong execution body
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ine 'THECAULDRON') {
            throw "Refusing Ritsu OS contract test on $env:COMPUTERNAME; expected THECAULDRON."
          }
          Write-Host "RITSU_TEST_BODY_OK computer=$env:COMPUTERNAME"
      - name: Compile candidate
        shell: powershell
        run: |
          python -m py_compile tools/ritsu_context_router.py tools/test_ritsu_context_router.py tools/ritsu_primary_gate.py tools/test_ritsu_primary_gate.py tools/ritsu_surface_gate.py tools/test_ritsu_surface_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Ritsu candidate compilation failed.' }
      - name: Run Ritsu continuity canaries
        shell: powershell
        run: |
          python tools/test_ritsu_context_router.py
          if ($LASTEXITCODE -ne 0) { throw 'Ritsu continuity canaries failed.' }
      - name: Run primary evidence closure canaries
        shell: powershell
        run: |
          python tools/test_ritsu_primary_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Ritsu primary-evidence closure canaries failed.' }
      - name: Run Ritsu-first surface canaries
        shell: powershell
        run: |
          python tools/test_ritsu_surface_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Ritsu-first surface canaries failed.' }
      - name: Smoke canonical cue
        shell: powershell
        run: |
          $payload = python tools/ritsu_context_router.py "Latin plays"
          if ($LASTEXITCODE -ne 0) { throw 'Ritsu canonical cue smoke failed.' }
          $data = $payload | ConvertFrom-Json
          if ($data.status -ne 'MATCH') { throw "Expected MATCH; got $($data.status)" }
          if ($data.episode_id -ne 'ritsu-latin-cassette-intercom-v1') { throw "Wrong episode: $($data.episode_id)" }
          if ($data.provenance_tier -ne 'accepted_summary') { throw "Wrong provenance: $($data.provenance_tier)" }
          if ($data.world_knowledge_allowed -ne $false) { throw 'World-knowledge hijack gate is open.' }
          if ($data.seek_primary -ne $true) { throw 'Missing-primary obligation disappeared.' }
          if (-not (($data.corrections -join ' ') -match 'dropped')) { throw 'AGAIN correction overlay is missing.' }
          Write-Host $payload
      - name: Smoke primary evidence closure gate
        shell: powershell
        run: |
          $payload = python tools/ritsu_primary_gate.py ritsu-latin-cassette-intercom-v1
          if ($LASTEXITCODE -ne 0) { throw 'Ritsu primary gate smoke failed.' }
          $data = $payload | ConvertFrom-Json
          if ($data.status -ne 'CONTINUITY_GAP') { throw "Expected CONTINUITY_GAP; got $($data.status)" }
          if ($data.provenance -ne 'accepted_summary') { throw "Wrong primary-gate provenance: $($data.provenance)" }
          if ($data.can_close_active_retrieval -ne $false) { throw 'Primary retrieval closed without complete primary evidence.' }
          if (-not ($data.missing -contains 'episode_primary_transcript')) { throw 'Episode primary gap disappeared.' }
          if (-not ($data.missing -contains 'correction_primary:latin-again-correction-v1')) { throw 'AGAIN primary gap disappeared.' }
          Write-Host $payload
      - name: Smoke Ritsu-first canonical surface
        shell: powershell
        run: |
          $payload = python tools/ritsu_surface_gate.py "Latin plays"
          if ($LASTEXITCODE -ne 0) { throw 'Ritsu-first canonical surface smoke failed.' }
          $data = $payload | ConvertFrom-Json
          if ($data.speaker -ne 'Ritsu') { throw "Wrong active surface: $($data.speaker)" }
          if ($data.emit -ne $true) { throw 'Canonical Ritsu answer was suppressed.' }
          if ($data.mode -ne 'answer') { throw "Wrong surface mode: $($data.mode)" }
          if ($data.retrieval_narration_allowed -ne $false) { throw 'Retrieval narration leaked open.' }
          if ($data.identity_explanation_allowed -ne $false) { throw 'Ritsu identity explanation leaked open.' }
          if ($data.render_context.episode_id -ne 'ritsu-latin-cassette-intercom-v1') { throw 'Canonical episode did not reach Ritsu surface.' }
          if (-not (($data.render_context.corrections -join ' ') -match 'dropped')) { throw 'AGAIN correction did not reach Ritsu surface.' }
          Write-Host $payload
