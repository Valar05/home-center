name: Fortress Beard source transform (one-shot)

on:
  push:
    branches:
      - fortress/night-core-beard
    paths:
      - '.github/workflows/fortress-beard-port-once.yml'
      - 'tools/port_android_beard_ui.py'
      - 'tools/test_adam_overlay_contract.py'
      - 'android/operator-overlay/app/src/main/java/com/homecenter/operatoroverlay/OperatorOverlayService.java'

permissions:
  contents: write

jobs:
  transform-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          ref: fortress/night-core-beard
          fetch-depth: 0
      - name: Run deterministic Beard transform
        run: python3 tools/port_android_beard_ui.py
      - name: Run requested source contracts
        run: |
          python3 tools/test_adam_overlay_contract.py
          python3 tools/test_night_core_contract.py
          python3 tools/test_adam_auto_router_contract.py
      - name: Commit generated service and remove one-shot harness
        run: |
          git config user.name "Fortress Beard Port"
          git config user.email "actions@users.noreply.github.com"
          git add android/operator-overlay/app/src/main/java/com/homecenter/operatoroverlay/OperatorOverlayService.java tools/test_adam_overlay_contract.py
          git rm .github/workflows/fortress-beard-port-once.yml
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "feat(beard): apply deterministic one-input overlay transform"
          git push origin HEAD:fortress/night-core-beard
