name: Build Android

# GitHub-hosted compute is an emergency/manual lane only.
# Android truth runs on the phone runner in the private Gitea forge.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK for manual builds
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
