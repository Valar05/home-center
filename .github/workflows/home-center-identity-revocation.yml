name: Home Center identity revocation

on:
  pull_request:
    paths:
      - "functions/home_center_access_policy.js"
      - "functions/home_center_identity_security.js"
      - "functions/home_center_mcp.js"
      - "functions/index.js"
      - "functions/command_center_mcp.js"
      - "functions/phone_hands_relay.js"
      - "functions/she_raw_mcp.js"
      - "functions/venice_home_center_mcp.js"
      - "firebase/firestore.rules"
      - "tools/home_center_authorization_contract_test.mjs"
      - ".github/workflows/home-center-identity-revocation.yml"
  workflow_dispatch:

jobs:
  revocation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Syntax-check authorization entrypoints
        run: |
          node --check functions/home_center_access_policy.js
          node --check functions/home_center_identity_security.js
          node --check functions/home_center_mcp.js
          node --check functions/index.js
          node --check functions/command_center_mcp.js
          node --check functions/phone_hands_relay.js
          node --check functions/she_raw_mcp.js
          node --check functions/venice_home_center_mcp.js
      - name: Authorization contract
        run: node tools/home_center_authorization_contract_test.mjs
      - name: Command Center contract
        run: node tools/command_center_mcp_contract_test.mjs
      - name: Home Center status contract
        run: node tools/home_center_status_contract_test.mjs
      - name: Home Center regression tests
        run: python3 tools/home_center_regression_tests.py
      - name: Diff whitespace gate
        run: git diff --check
