name: Operator Overlay Android

on:
  push:
    branches:
      - main
      - feature/operator-overlay-v1
      - feat/spotify-radio-runtime-prep-20260813
    paths:
      - 'android/operator-overlay/**'
      - 'tools/android_operator_overlay.py'
      - 'tools/android_phone_home_center_relay.py'
      - 'tools/setup_android_operator_overlay.sh'
      - 'tools/build_operator_overlay_signed.ps1'
      - 'tools/phone_hands_relay_contract_test.mjs'
      - 'functions/phone_hands_relay.js'
      - '.github/workflows/operator-overlay-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/operator-overlay/**'
      - 'tools/android_operator_overlay.py'
      - 'tools/android_phone_home_center_relay.py'
      - 'tools/setup_android_operator_overlay.sh'
      - 'tools/build_operator_overlay_signed.ps1'
      - 'tools/phone_hands_relay_contract_test.mjs'
      - 'functions/phone_hands_relay.js'
      - '.github/workflows/operator-overlay-android.yml'
  workflow_dispatch:
    inputs:
      ritsu_trial:
        description: 'Build Ritsu Control trial APK only'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.event.inputs.ritsu_trial != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap Android and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          python --version
          node --version
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -1 || true)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          GRADLE_HOME=/tmp/gradle-8.9
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl -fsSL --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            EXPECTED="$(curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256 | awk '{print $1}')"
            ACTUAL="$(sha256sum /tmp/gradle.zip | awk '{print $1}')"
            test "$EXPECTED" = "$ACTUAL"
            unzip -q /tmp/gradle.zip -d /tmp
          fi
          echo "HC_GRADLE=$GRADLE_HOME/bin/gradle" >> "$GITHUB_ENV"

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/android_operator_overlay.py tools/android_phone_home_center_relay.py
          python tools/test_spotify_background_radio.py
          node --check functions/phone_hands_relay.js
          node tools/phone_hands_relay_contract_test.mjs
          git diff --check

      - name: Build with durable Home Center signing identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/build_operator_overlay_signed.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ExpectedSourceSha $env:GITHUB_SHA `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/operator-overlay') `
            -GeneratedSigningRef 'origin/generated/operator-overlay-apk' `
            -GradleExecutable $env:HC_GRADLE `
            -AndroidSdk $env:ANDROID_SDK_ROOT
          Get-Content (Join-Path $env:GITHUB_WORKSPACE 'build/operator-overlay/operator-overlay-receipt.json')

      - name: Publish exact signed APK from merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PUB="$(mktemp -d)"
          git fetch origin generated/operator-overlay-apk --no-tags
          git worktree add "$PUB/artifact" origin/generated/operator-overlay-apk
          cp build/operator-overlay/operator-overlay-debug.apk "$PUB/artifact/operator-overlay-debug.apk"
          cp build/operator-overlay/operator-overlay-receipt.json "$PUB/artifact/operator-overlay-receipt.json"
          cd "$PUB/artifact"
          git config user.name 'home-center-operator-overlay-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add operator-overlay-debug.apk operator-overlay-receipt.json
          git commit -m "Publish durable-signed operator overlay for ${SOURCE_SHA}"
          git push origin HEAD:refs/heads/generated/operator-overlay-apk

  ritsu-trial:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.ritsu_trial == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify and build Ritsu Control
        run: |
          set -euo pipefail
          gradle -p android/ritsu-control :app:testDebugUnitTest :app:assembleDebug -PritsuStableInstall=true --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/ritsu-control/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ritsu-Control-v0.15-APK
          path: android/ritsu-control/app/build/outputs/apk/debug/app-debug.apk
