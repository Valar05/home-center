name: Validate Phone Shell Overlay Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate relay syntax and Phone Shell control separation
        run: |
          python -m py_compile tools/android_phone_home_center_relay.py tools/android_phone_termux_shell.py
          node tools/phone_shell_overlay_gate_contract_test.mjs
          git diff --check
