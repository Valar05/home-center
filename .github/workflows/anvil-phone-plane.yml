name: Anvil native phone plane

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "functions/home_center_mcp.js"
      - "functions/phone_operation_surface.js"
      - "functions/phone_hands_relay.js"
      - "tools/android_phone_home_center_relay.py"
      - "tools/android_phone_diagnostics.py"
      - "tools/android_anvil_shell_maintenance.py"
      - "tools/phone_diagnostics_relay_test.mjs"
      - "tools/phone_maintenance_relay_test.mjs"
      - "docs/reviews/anvil-phone-plane-*.json"
      - ".github/workflows/anvil-phone-plane.yml"

permissions:
  contents: read

jobs:
  native-phone-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify JavaScript operation and relay contracts
        run: |
          node --check functions/home_center_mcp.js
          node --check functions/phone_operation_surface.js
          node --check functions/phone_hands_relay.js
          node tools/phone_diagnostics_relay_test.mjs
          node tools/phone_maintenance_relay_test.mjs
      - name: Verify phone worker modules and fixed maintenance request
        run: |
          python -m py_compile             tools/android_phone_home_center_relay.py             tools/android_phone_diagnostics.py             tools/android_anvil_shell_maintenance.py
          python - <<'PY'
          from tools.android_anvil_shell_maintenance import validate
          request={
              "action":"anvil_shell_build_install",
              "schema":"phone.maintenance.anvil-shell.v1",
              "operation":"anvil_shell.build_install.v1",
              "automaticReplay":False,
              "deviceId":"primary-phone",
              "packageId":"com.continuecontinue.anvilshell",
              "workerId":"phone-relay:primary-phone",
              "queueDocId":"ci",
              "queueRevision":"ci-1",
              "commissionHash":"a"*64,
              "laneId":"PHONE_MAINTENANCE",
              "sessionId":"ci",
              "approvalId":"ci",
              "leaseId":"ci",
              "sourceRepository":"Valar05/continue-continue",
              "sourceHead":"7e0e949ba3e3aefa8df608226086b6273cfb16ca",
              "sourceSubdir":"edge/android-shell",
              "expectedVersionName":"0.1.0-checkpoint",
              "timeoutSeconds":1800,
              "networkPolicy":"bootstrap-and-build",
              "rollbackPolicy":"retain_previous_apk_if_present",
          }
          validate(request)
          for field,value in (
              ("command","id"),
              ("argv",["sh","-c","id"]),
              ("sourceSubdir","../escape"),
              ("deviceId","other-phone"),
              ("automaticReplay",True),
          ):
              bad=dict(request); bad[field]=value
              try:
                  validate(bad)
              except (ValueError,PermissionError):
                  continue
              raise AssertionError(f"unsafe request accepted: {field}")
          print("phone maintenance Python executor validation: PASS")
          PY
      - name: Verify canonical Regnet CLI
        run: python tools/test_renee_cli.py
      - name: Issue synthetic Regnet QA receipt
        env:
          REGNET_HOME: ${{ runner.temp }}/anvil-phone-regnet
          REGNET_OUT: ${{ runner.temp }}/anvil-phone-regnet-out
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$REGNET_HOME/evidence" "$REGNET_OUT"
          python - "$REGNET_HOME/evidence/native-phone-plane.json" <<'PY'
          import json,os,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          path.write_text(json.dumps({
              "schema":"home-center.anvil-phone-plane.source-evidence.v1",
              "repository":os.environ["GITHUB_REPOSITORY"],
              "reviewedHead":os.environ["REVIEWED_HEAD"],
              "workflowRun":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "checks":[
                  "native Home Center phone operation registry",
                  "strict diagnostics relay",
                  "strict Anvil maintenance allowlist",
                  "lease and idempotency enforcement",
                  "terminal APK signer/install/readback receipt validation",
                  "phone worker Python compilation",
              ],
              "stateBoundary":{
                  "sourceTested":True,
                  "deployed":False,
                  "workerInstalled":False,
                  "phoneCallable":False,
                  "anvilInstalled":False,
                  "delivered":False,
                  "accepted":False,
              },
          },indent=2,sort_keys=True)+"\n")
          PY
          python tools/renee.py --home "$REGNET_HOME" --json review             "Native Home Center phone source exposes bounded read-only diagnostics and one lease-bound Anvil build/install operation without Command Center or generic shell substitution."             --state tested             --acceptance "phone.* operations are present in the drive_operation registry"             --acceptance "raw command, argv, URL, arbitrary path, identity drift, automatic replay, and forged receipts are rejected"             --acceptance "maintenance binds exact source commit, APK hash, signer, install result, rollback, and package readback"             --acceptance "repository proof remains below deployment and phone callability"             --evidence "$REGNET_HOME/evidence/native-phone-plane.json"             --evidence "docs/reviews/anvil-phone-plane-venice-plan.json"             --evidence-ref "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --failure-path "deployed registry does not expose the new phone operations"             --failure-path "primary-phone worker does not advertise phone_maintenance_anvil_shell"             --failure-path "phone toolchain, signer verification, install authority, or byte readback fails"             --dissent "SYNTHETIC_REGNET cannot grant Venice stop authority or phone acceptance."             --dissent "Source tests are not deployment, worker installation, or Anvil phone installation."             --require-evidence | tee "$REGNET_OUT/regnet-output.json"
          cp "$REGNET_HOME"/receipts/*.json "$REGNET_OUT/"
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-native-phone-regnet-receipt
          path: ${{ runner.temp }}/anvil-phone-regnet-out/
          if-no-files-found: error
