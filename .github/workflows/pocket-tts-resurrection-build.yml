name: Pocket TTS Resurrection Build

on:
  push:
    branches:
      - fortress/pocket-tts-resurrection-v1
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/dclar/homecenter/PocketTtsControlActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - '.github/workflows/pocket-tts-resurrection-build.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Materialize APK receipt
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          BYTES=$(wc -c < "$APK" | tr -d ' ')
          printf '%s\n' \
            'schema=fortress.pocket-tts-resurrection-apk.v1' \
            "commit=${GITHUB_SHA}" \
            'package=com.dclar.homecenter' \
            'versionName=0.2.60-pocket-resurrection' \
            'versionCode=64' \
            "apkBytes=${BYTES}" \
            "apkSha256=${SHA}" \
            'controlActivity=com.dclar.homecenter.PocketTtsControlActivity' \
            'playbackActivity=com.dclar.homecenter.PocketTtsPlaybackActivity' \
            > pocket-tts-apk-receipt.txt
          cat pocket-tts-apk-receipt.txt

      - name: Upload APK and receipt
        uses: actions/upload-artifact@v4
        with:
          name: home-center-pocket-tts-resurrection-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            pocket-tts-apk-receipt.txt
