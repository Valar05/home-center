name: Patch Computer Hands Shared Lanes v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-computer-hands-shared-lanes-v3
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic shared-lane patch
        run: python3 tools/patch_computer_hands_shared_lanes_v3.py

      - name: Rewrite focused test with real newlines
        shell: bash
        run: |
          cat > functions/computer_hands_shared_lanes.test.js <<'JS'
          'use strict';
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const api = require('./computer_hands_api');

          test('packet.execute sanitizes bounded multi-step packets', () => {
            const packet = api.sanitizeActionArgs('packet.execute', {label: 'archaeology', steps: [
              {id: 'status', action: 'system.status', arguments: {}},
              {id: 'windows', action: 'window.list', arguments: {}},
              {id: 'shell', action: 'shell.exec', arguments: {command: 'Get-Date'}},
            ]});
            assert.equal(packet.steps.length, 3);
            assert.equal(packet.steps[2].arguments.command, 'Get-Date');
            assert.equal(api.permissionClass('packet.execute', packet), 'high_risk_write');
          });

          test('packet nesting and oversize step counts fail closed', () => {
            assert.throws(() => api.sanitizeActionArgs('packet.execute', {steps: [{action: 'packet.execute', arguments: {steps: []}}]}), /Nested packet/);
            assert.throws(() => api.sanitizeActionArgs('packet.execute', {steps: Array.from({length: 33}, () => ({action: 'system.status'}))}), /1-32/);
          });

          test('lane ids preserve safe ids and hash unsafe thread names', () => {
            assert.equal(api.safeLaneId('chat.thread-01'), 'chat.thread-01');
            assert.match(api.safeLaneId('thread with spaces / punctuation'), /^lane-[0-9a-f]{24}$/);
          });
          JS

      - name: Validate source and focused contracts
        run: |
          node --check functions/computer_hands_api.js
          node --test functions/computer_hands_shared_lanes.test.js
          python3 - <<'PY'
          from pathlib import Path
          api = Path('functions/computer_hands_api.js').read_text(encoding='utf-8')
          worker = Path('computer-hands/windows/home-center-hands.ps1').read_text(encoding='utf-8')
          repair = Path('computer-hands/windows/repair.ps1').read_text(encoding='utf-8')
          for required in [
              "const PACKET_ACTION = 'packet.execute'",
              'const MAX_PACKET_STEPS = 32',
              'function safeLaneId',
              'async function cancelRequestOperation',
              'lastServedLaneId',
              'limit(100)',
          ]:
              assert required in api, f'missing API feature: {required}'
          for required in [
              'function Write-ProgressState',
              "if($action -ne 'packet.execute')",
              "phase='packet_step'",
              '$ProgressPath',
          ]:
              assert required in worker, f'missing worker feature: {required}'
          assert 'LOCAL_HANDS_PROGRESS.json' in repair
          print('Computer Hands shared-lane v3 static acceptance passed')
          PY

      - name: Diff validation
        run: git diff --check

      - name: Commit durable shared-lane implementation
        run: |
          if git diff --quiet -- functions/computer_hands_api.js computer-hands/windows/home-center-hands.ps1 computer-hands/windows/repair.ps1 functions/computer_hands_shared_lanes.test.js; then
            echo 'Shared-lane implementation already applied.'
            exit 0
          fi
          git config user.name 'home-center-github-admin[bot]'
          git config user.email 'home-center-github-admin[bot]@users.noreply.github.com'
          git add functions/computer_hands_api.js computer-hands/windows/home-center-hands.ps1 computer-hands/windows/repair.ps1 functions/computer_hands_shared_lanes.test.js
          git commit -m 'Add Computer Hands shared lanes and packet progress'
          git push origin HEAD:main
