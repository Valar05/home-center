name: Deploy Reality Membrane observe canary

on:
  push:
    branches:
      - reality-membrane-canary-20260813
    paths:
      - .github/workflows/deploy-reality-membrane-observe-canary.yml

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: deploy-reality-membrane-observe-canary
  cancel-in-progress: false

env:
  OBSERVE_TEST_COMMAND_ID: phc_reality_observe_authorized_tests_20260813
  HC_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOME_CENTER_DCLAR }}
  HC_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  HC_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  HC_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  HC_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
  HC_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  HC_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GH_TOKEN: ${{ github.token }}

jobs:
  gate-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reality-membrane-canary-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebase completed feature work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'home-center-github-admin[bot]'
          git config user.email 'home-center-github-admin[bot]@users.noreply.github.com'
          git fetch origin reality-membrane-canary-20260813
          git rebase origin/reality-membrane-canary-20260813
      - name: Authenticate with workload identity when configured
        if: env.HC_WIF_PROVIDER != '' && env.HC_WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.HC_WIF_PROVIDER }}
          service_account: ${{ env.HC_WIF_SERVICE_ACCOUNT }}
      - name: Select Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HC_WIF_PROVIDER}" ] && [ -n "${HC_WIF_SERVICE_ACCOUNT}" ]; then echo 'AUTH_MODE=workload_identity' >> "$GITHUB_ENV"; exit 0; fi
          credential=''
          for candidate in "$HC_FIREBASE_SA" "$HC_GOOGLE_CREDENTIALS" "$HC_GCP_SA_KEY" "$HC_FIREBASE_SERVICE_ACCOUNT"; do if [ -n "$candidate" ]; then credential="$candidate"; break; fi; done
          if [ -n "$credential" ]; then
            path="$RUNNER_TEMP/home-center-firebase-service-account.json"
            printf '%s' "$credential" > "$path"
            chmod 600 "$path"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$path" >> "$GITHUB_ENV"
            echo 'AUTH_MODE=service_account_json' >> "$GITHUB_ENV"
          elif [ -n "$HC_FIREBASE_TOKEN" ]; then echo 'AUTH_MODE=firebase_token' >> "$GITHUB_ENV"
          else echo 'No recognized Firebase/GCP deployment credential is configured.' >&2; exit 41; fi
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Gate on actual primary-phone observe tests
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          node - <<'NODE'
          const admin=require('firebase-admin');if(!admin.apps.length)admin.initializeApp({projectId:'home-center-dclar'});const db=admin.firestore(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const id=process.env.OBSERVE_TEST_COMMAND_ID,deadline=Date.now()+15*60*1000;let c=null;while(Date.now()<deadline){const s=await db.collection('phoneHandsCommands').doc(id).get();c=s.exists?s.data():null;if(c&&['completed','failed'].includes(c.status))break;await sleep(5000);}const r=c&&c.result||{},out=String(r.stdout||'');const required=['Reality Membrane contract tests passed','Reality Membrane runtime patch contract tests passed','Reality Membrane observe contract tests passed','Reality Membrane observe wiring tests passed','REALITY_OBSERVE_AUTHORIZED_BODY_TESTS=passed'];if(!c||c.status!=='completed'||r.ok!==true||Number(r.exitCode)!==0||required.some(x=>!out.includes(x)))throw new Error('observe_phone_gate_failed:'+JSON.stringify(c));console.log(JSON.stringify({commandId:id,status:c.status,completedAtMs:c.completedAtMs,stdout:out}));})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Apply and test complete observe runtime
        run: |
          node tools/install_reality_membrane_runtime_patch.mjs
          node tools/install_reality_membrane_observe_patch.mjs
          node tools/reality_membrane_contract_test.mjs
          node tools/reality_membrane_runtime_patch_test.mjs
          node tools/reality_membrane_observe_contract_test.mjs
          node tools/reality_membrane_observe_wiring_test.mjs
          git diff --check
      - name: Deploy only Home Center MCP
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = 'firebase_token' ]; then
            npx --yes firebase-tools@latest deploy --project home-center-dclar --only functions:homeCenterMcp --non-interactive --token "$HC_FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project home-center-dclar --only functions:homeCenterMcp --non-interactive
          fi
      - name: Record deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');const receipt={schema:'home-center.reality-membrane.observe-deployment.v1',recordedAt:new Date().toISOString(),repository:process.env.GITHUB_REPOSITORY,branch:'reality-membrane-canary-20260813',sourceSha:process.env.GITHUB_SHA,authorizedPhoneTestCommandId:process.env.OBSERVE_TEST_COMMAND_ID,deployment:{project:'home-center-dclar',function:'homeCenterMcp',region:'us-central1'},surfaces:['reality.status','reality.observe','reality.history','reality.sources','reality.capabilities','reality.events'],implementedSources:['home_center.runtime_clock','phone_hands.phone_shell','open_meteo.public_forecast','weather_gov.active_alerts'],stateLedger:{implemented:true,testedOnAuthorizedPhone:true,deployed:true,callableProofPending:true,boringCanaryAccepted:false,fictionGenerated:false},evidenceBoundary:'Deployment and phone test evidence do not substitute for a post-deploy Home Center reality.observe call.'};receipt.receiptSha256=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');fs.writeFileSync('docs/evidence/reality-membrane-observe-deployment-20260813.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Rebase, retain deployed source, and remove one-use workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin reality-membrane-canary-20260813
          git rebase origin/reality-membrane-canary-20260813
          node tools/install_reality_membrane_runtime_patch.mjs
          node tools/install_reality_membrane_observe_patch.mjs
          node tools/reality_membrane_contract_test.mjs
          node tools/reality_membrane_runtime_patch_test.mjs
          node tools/reality_membrane_observe_contract_test.mjs
          node tools/reality_membrane_observe_wiring_test.mjs
          git rm --ignore-unmatch .github/workflows/apply-reality-membrane-observe-runtime.yml
          git rm --ignore-unmatch .github/workflows/deploy-reality-membrane-observe-canary.yml
          git add functions/home_center_mcp.js functions/reality_membrane.js functions/reality_membrane_runtime.js tools/install_reality_membrane_runtime_patch.mjs tools/install_reality_membrane_observe_patch.mjs tools/reality_membrane_contract_test.mjs tools/reality_membrane_runtime_patch_test.mjs tools/reality_membrane_observe_contract_test.mjs tools/reality_membrane_observe_wiring_test.mjs docs/evidence/reality-membrane-observe-deployment-20260813.json
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'Deploy usable Reality Membrane observe runtime'; fi
          git push origin HEAD:reality-membrane-canary-20260813
      - name: Comment exact callable-proof boundary on PR 267
        shell: bash
        run: |
          gh pr comment 267 --repo "$GITHUB_REPOSITORY" --body 'The usable Reality Membrane runtime was deployed after all four deterministic contracts passed on `primary-phone`. It now implements status, observe, history/events, sources, and capabilities with actual clock, bounded Phone Hands state, free public weather/daylight/alerts, provenance, privacy filtering, and accessible summary. Deployment receipt: `docs/evidence/reality-membrane-observe-deployment-20260813.json`. **Still not accepted:** Home Center must perform a post-deploy `reality.observe` boring canary and return the actual packet.'
