name: Patch Venice Recovery Native Stderr v3.4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_venice_recovery_native_stderr_v3_4.py
      - name: Static assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F '& git -C $RepoPath fetch --quiet origin main' computer-hands/windows/repair.ps1
          grep -F '& git -C $RepoPath fetch --quiet origin main' staging/venice-phase1/install-shadow-v2.ps1
          grep -F '& git -C $RepoPath fetch --quiet origin main' staging/venice-phase1/recover-hands-and-install-shadow-v2.ps1
          grep -F 'function Invoke-CapturedPowerShell' staging/venice-phase1/recover-hands-and-install-shadow-v2.ps1
          ! grep -F '$repairRaw = (& powershell.exe' staging/venice-phase1/recover-hands-and-install-shadow-v2.ps1
          ! grep -F '$phaseRaw = (& powershell.exe' staging/venice-phase1/recover-hands-and-install-shadow-v2.ps1
          ! grep -F '$patchOutput = (& powershell.exe' staging/venice-phase1/install-shadow-v2.ps1
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'home-center-bot'
          git config user.email 'home-center-bot@users.noreply.github.com'
          git add computer-hands/windows/repair.ps1 staging/venice-phase1/install-shadow-v2.ps1 staging/venice-phase1/recover-hands-and-install-shadow-v2.ps1
          git commit -m 'Harden Venice recovery native stderr handling'
          git push origin HEAD:main
