name: Cleanup Morning Clock Policy Scaffolding

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-use patch scaffolding
        run: |
          rm -f tools/patch_morning_clock_doctrine.js
          rm -f .github/workflows/apply-morning-clock-policy.yml
          rm -f .github/workflows/cleanup-morning-clock-policy.yml
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "home-center-dru-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
          else
            git commit -m "Remove morning clock patch scaffolding"
            git push origin HEAD:main
          fi
