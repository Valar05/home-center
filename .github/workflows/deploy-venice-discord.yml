name: Deploy Venice Discord

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to confirm
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-venice-discord
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install release prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          npm install --global firebase-tools@15.26.0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Venice Discord interaction runtime
        run: sh tools/deploy_venice_discord.sh home-center-dclar --approve-warm-cost
