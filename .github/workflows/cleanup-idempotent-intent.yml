name: Cleanup Idempotent Intent Scaffolding

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-use patch scaffolding
        run: |
          git rm .github/workflows/patch-idempotent-intent.yml
          git rm .github/scripts/patch-idempotent-intent.js
          git rm .github/workflows/cleanup-idempotent-intent.yml
      - name: Commit cleanup
        run: |
          git config user.name "home-center-dru-patcher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove idempotent intent patch scaffolding"
          git push origin HEAD:main
