name: Fortress Image Preset Contract

on:
  pull_request:
    paths:
      - 'tools/fortress_image_cli.py'
      - 'tools/fortress_image_presets.json'
      - 'tools/fortress_image_cauldron.ps1'
      - 'tools/venice_fleshpunk_phone.sh'
      - 'tools/install_fortress_image_phone.sh'
      - 'tools/fortress_image_entry.sh'
      - 'tools/accept_fortress_image_phone.sh'
      - 'tools/test_fortress_image_cli.py'
      - 'tools/test_improper_image_delivery_contract.py'
      - 'docs/IMPROPER_IMAGE_DELIVERY_CAMPAIGN.md'
      - '.github/workflows/fortress-image-preset-contract.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fortress_image_cli.py'
      - 'tools/fortress_image_presets.json'
      - 'tools/fortress_image_cauldron.ps1'
      - 'tools/venice_fleshpunk_phone.sh'
      - 'tools/install_fortress_image_phone.sh'
      - 'tools/test_fortress_image_cli.py'
      - 'tools/test_improper_image_delivery_contract.py'
      - '.github/workflows/fortress-image-preset-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortress-image-preset-contract
  cancel-in-progress: true

jobs:
  contract:
    name: THECAULDRON source contract
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Refuse the wrong execution body
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ine 'THECAULDRON') {
            throw "Refusing Fortress Image contract on $env:COMPUTERNAME; expected THECAULDRON."
          }
          Write-Host "FORTRESS_IMAGE_CONTRACT_BODY_OK computer=$env:COMPUTERNAME"

      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          fetch-depth: 1
          lfs: false

      - name: Bash and Python contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if (-not $bash) {
            $candidates = @(
              (Join-Path $env:ProgramFiles 'Git\bin\bash.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Git\bin\bash.exe')
            )
            $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $found) { throw 'Git Bash is required for Fortress Image shell contract checks.' }
            $bashPath = $found
          } else {
            $bashPath = $bash.Source
          }
          & $bashPath -n tools/venice_fleshpunk_phone.sh
          if ($LASTEXITCODE -ne 0) { throw 'venice_fleshpunk_phone.sh syntax failed' }
          & $bashPath -n tools/fortress_image_entry.sh
          if ($LASTEXITCODE -ne 0) { throw 'fortress_image_entry.sh syntax failed' }
          & $bashPath -n tools/install_fortress_image_phone.sh
          if ($LASTEXITCODE -ne 0) { throw 'install_fortress_image_phone.sh syntax failed' }
          & $bashPath -n tools/accept_fortress_image_phone.sh
          if ($LASTEXITCODE -ne 0) { throw 'accept_fortress_image_phone.sh syntax failed' }
          python -m py_compile tools/fortress_image_cli.py tools/test_fortress_image_cli.py
          if ($LASTEXITCODE -ne 0) { throw 'Fortress Image Python syntax failed' }
          python tools/test_fortress_image_cli.py
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic preset tests failed' }
          python tools/test_improper_image_delivery_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Existing image transport contract failed' }

      - name: PowerShell parser contract
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/fortress_image_cauldron.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'FORTRESS_IMAGE_POWERSHELL_PARSE_OK'
