name: Apply Reality Membrane unknown and projection corrections

on:
  push:
    branches:
      - reality-membrane-canary-20260813
    paths:
      - .github/workflows/apply-reality-membrane-unknown-projection.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-reality-membrane-unknown-projection
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reality-membrane-canary-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebase latest feature work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'home-center-github-admin[bot]'
          git config user.email 'home-center-github-admin[bot]@users.noreply.github.com'
          git fetch origin reality-membrane-canary-20260813
          git rebase origin/reality-membrane-canary-20260813
      - name: Apply all Reality Membrane corrections
        run: |
          node tools/install_reality_membrane_runtime_patch.mjs
          node tools/install_reality_membrane_observe_patch.mjs
          node tools/install_reality_membrane_stale_accessibility_patch.mjs
          node tools/install_reality_membrane_unknown_projection_patch.mjs
      - name: Run complete deterministic contract suite
        run: |
          node tools/reality_membrane_contract_test.mjs
          node tools/reality_membrane_runtime_patch_test.mjs
          node tools/reality_membrane_observe_contract_test.mjs
          node tools/reality_membrane_observe_wiring_test.mjs
          node tools/reality_membrane_stale_accessibility_test.mjs
          node tools/reality_membrane_unknown_projection_test.mjs
          node tools/inner_fortress_reality_canary_scene_test.mjs
          node tools/reality_membrane_venice_review_test.mjs
      - name: Validate source diff
        run: git diff --check
      - name: Rebase, reapply, retain source, remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin reality-membrane-canary-20260813
          git rebase origin/reality-membrane-canary-20260813
          node tools/install_reality_membrane_runtime_patch.mjs
          node tools/install_reality_membrane_observe_patch.mjs
          node tools/install_reality_membrane_stale_accessibility_patch.mjs
          node tools/install_reality_membrane_unknown_projection_patch.mjs
          node tools/reality_membrane_contract_test.mjs
          node tools/reality_membrane_runtime_patch_test.mjs
          node tools/reality_membrane_observe_contract_test.mjs
          node tools/reality_membrane_observe_wiring_test.mjs
          node tools/reality_membrane_stale_accessibility_test.mjs
          node tools/reality_membrane_unknown_projection_test.mjs
          node tools/inner_fortress_reality_canary_scene_test.mjs
          node tools/reality_membrane_venice_review_test.mjs
          git rm --ignore-unmatch .github/workflows/apply-reality-membrane-unknown-projection.yml
          git add functions/home_center_mcp.js functions/reality_membrane.js functions/reality_membrane_runtime.js tools/install_reality_membrane_runtime_patch.mjs tools/install_reality_membrane_observe_patch.mjs tools/install_reality_membrane_stale_accessibility_patch.mjs tools/install_reality_membrane_unknown_projection_patch.mjs tools/reality_membrane_contract_test.mjs tools/reality_membrane_runtime_patch_test.mjs tools/reality_membrane_observe_contract_test.mjs tools/reality_membrane_observe_wiring_test.mjs tools/reality_membrane_stale_accessibility_test.mjs tools/reality_membrane_unknown_projection_test.mjs tools/inner_fortress_reality_canary_scene.mjs tools/inner_fortress_reality_canary_scene_test.mjs tools/reality_membrane_venice_review.mjs tools/reality_membrane_venice_review_test.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'Make unknowns explicit and retain compact provenance'; fi
          git push origin HEAD:reality-membrane-canary-20260813
