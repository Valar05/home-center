name: Converge and deploy Reality Membrane

on:
  workflow_dispatch:
  push:
    branches:
      - reality-membrane-canary-20260813
    paths:
      - .github/workflows/converge-deploy-reality-membrane.yml

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: converge-deploy-reality-membrane
  cancel-in-progress: false

env:
  BRANCH: reality-membrane-canary-20260813
  TEST_COMMAND_ID: phc_reality_final2_authorized_tests_20260813
  HC_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOME_CENTER_DCLAR }}
  HC_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  HC_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  HC_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  HC_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
  HC_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  HC_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GH_TOKEN: ${{ github.token }}

jobs:
  gate-deploy-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reality-membrane-canary-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reset to current converged branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'home-center-github-admin[bot]'
          git config user.email 'home-center-github-admin[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
      - name: Authenticate with workload identity when configured
        if: env.HC_WIF_PROVIDER != '' && env.HC_WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.HC_WIF_PROVIDER }}
          service_account: ${{ env.HC_WIF_SERVICE_ACCOUNT }}
      - name: Select Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HC_WIF_PROVIDER}" ] && [ -n "${HC_WIF_SERVICE_ACCOUNT}" ]; then echo 'AUTH_MODE=workload_identity' >> "$GITHUB_ENV"; exit 0; fi
          credential=''
          for candidate in "$HC_FIREBASE_SA" "$HC_GOOGLE_CREDENTIALS" "$HC_GCP_SA_KEY" "$HC_FIREBASE_SERVICE_ACCOUNT"; do if [ -n "$candidate" ]; then credential="$candidate"; break; fi; done
          if [ -n "$credential" ]; then
            path="$RUNNER_TEMP/home-center-firebase-service-account.json"
            printf '%s' "$credential" > "$path"
            chmod 600 "$path"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$path" >> "$GITHUB_ENV"
            echo 'AUTH_MODE=service_account_json' >> "$GITHUB_ENV"
          elif [ -n "$HC_FIREBASE_TOKEN" ]; then echo 'AUTH_MODE=firebase_token' >> "$GITHUB_ENV"
          else echo 'No recognized Firebase/GCP deployment credential is configured.' >&2; exit 41; fi
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Gate on final2 terminal primary-phone suite
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          node - <<'NODE'
          const admin=require('firebase-admin');if(!admin.apps.length)admin.initializeApp({projectId:'home-center-dclar'});const db=admin.firestore(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const id=process.env.TEST_COMMAND_ID,deadline=Date.now()+35*60*1000;let c=null;while(Date.now()<deadline){const s=await db.collection('phoneHandsCommands').doc(id).get();c=s.exists?s.data():null;if(c&&['completed','failed'].includes(c.status))break;await sleep(5000);}const r=c&&c.result||{},out=String(r.stdout||'');const required=['Reality Membrane contract tests passed','Reality Membrane runtime patch contract tests passed','Reality Membrane observe contract tests passed','Reality Membrane observe wiring tests passed','Reality Membrane stale reconciliation and accessibility tests passed','Reality Membrane unknown/projection/accessibility tests passed','Inner Fortress Reality Membrane canary scene tests passed','Venice Reality Membrane review tests passed','REALITY_FINAL2_AUTHORIZED_BODY_TESTS=passed'];if(!c||c.status!=='completed'||r.ok!==true||Number(r.exitCode)!==0||required.some(x=>!out.includes(x)))throw new Error('final2_phone_gate_failed:'+JSON.stringify(c));console.log(JSON.stringify({commandId:id,status:c.status,completedAtMs:c.completedAtMs,stdout:out}));})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Verify converged source and complete suite again
        shell: bash
        run: |
          set -euo pipefail
          node tools/install_reality_membrane_runtime_patch.mjs
          node tools/install_reality_membrane_observe_patch.mjs
          node tools/install_reality_membrane_stale_accessibility_patch.mjs
          node tools/install_reality_membrane_unknown_projection_patch.mjs
          node tools/reality_membrane_contract_test.mjs
          node tools/reality_membrane_runtime_patch_test.mjs
          node tools/reality_membrane_observe_contract_test.mjs
          node tools/reality_membrane_observe_wiring_test.mjs
          node tools/reality_membrane_stale_accessibility_test.mjs
          node tools/reality_membrane_unknown_projection_test.mjs
          node tools/inner_fortress_reality_canary_scene_test.mjs
          node tools/reality_membrane_venice_review_test.mjs
          git diff --check
          if ! git diff --quiet; then echo 'Converged branch still required source mutation.' >&2; git diff --stat; exit 43; fi
          echo "DEPLOYED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Deploy only Home Center MCP
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = 'firebase_token' ]; then
            npx --yes firebase-tools@latest deploy --project home-center-dclar --only functions:homeCenterMcp --non-interactive --token "$HC_FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project home-center-dclar --only functions:homeCenterMcp --non-interactive
          fi
      - name: Build immutable deployment receipt in temporary storage
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');const receipt={schema:'home-center.reality-membrane.converged-deployment.v1',recordedAt:new Date().toISOString(),repository:process.env.GITHUB_REPOSITORY,branch:process.env.BRANCH,deployedSourceSha:process.env.DEPLOYED_SOURCE_SHA,authorizedPhoneTestCommandId:process.env.TEST_COMMAND_ID,deployment:{project:'home-center-dclar',function:'homeCenterMcp',region:'us-central1'},surfaces:['reality.status','reality.observe','reality.history','reality.sources','reality.capabilities','reality.events'],sources:['home_center.runtime_clock','phone_hands.phone_shell','open_meteo.public_forecast','weather_gov.active_alerts'],corrections:['unknown_remains_unavailable','full_compact_observation_contract','stale_reconciliation','active_alerts_not_replayed','natural_accessible_summary','explicit_time_bridge','separate_fiction_transformer'],stateLedger:{implemented:true,runnerTestsPassed:true,authorizedPhoneTestsPassed:true,deployed:true,postDeployCallableCanaryPending:true,accepted:false},evidenceBoundary:'This receipt locks the exact deployed SHA. A fresh Home Center call is still required.'};receipt.receiptSha256=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');fs.writeFileSync(process.env.RUNNER_TEMP+'/reality-deployment-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Commit receipt without dirty rebase
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p docs/evidence
            cp "$RUNNER_TEMP/reality-deployment-receipt.json" docs/evidence/reality-membrane-converged-deployment-20260813.json
            git rm --ignore-unmatch .github/workflows/converge-deploy-reality-membrane.yml
            git rm --ignore-unmatch .github/workflows/deploy-reality-membrane-final-corrections.yml
            git rm --ignore-unmatch .github/workflows/deploy-reality-membrane-final2-corrections.yml
            git add docs/evidence/reality-membrane-converged-deployment-20260813.json
            git diff --cached --check
            git commit -m 'Record converged Reality Membrane deployment'
            if git push origin HEAD:"$BRANCH"; then echo 'DEPLOYMENT_RECEIPT_PUSHED'; exit 0; fi
            sleep $((attempt * 3))
          done
          echo 'DEPLOYMENT_RECEIPT_PUSH_EXHAUSTED' >&2
          exit 44
      - name: Comment exact deployed-state boundary on PR 267
        shell: bash
        run: |
          gh pr comment 267 --repo "$GITHUB_REPOSITORY" --body 'Race-safe deployment checkpoint: the converged Reality Membrane source passed the complete terminal `primary-phone` suite and was deployed as one exact SHA. Receipt: `docs/evidence/reality-membrane-converged-deployment-20260813.json`. A fresh post-deploy `reality.observe` canary is still the acceptance gate.'
