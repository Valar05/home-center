name: Reality Membrane Checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reality-membrane-checkpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out commissioned branch
        uses: actions/checkout@v4
        with:
          ref: reality-membrane-canary-20260813
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply canonical source patches
        run: |
          node tools/install_phone_hands_queue_starvation_fix.mjs
          node tools/install_reality_membrane_runtime_patch.mjs

      - name: Prove patcher idempotency
        run: |
          node tools/install_phone_hands_queue_starvation_fix.mjs
          node tools/install_reality_membrane_runtime_patch.mjs

      - name: Run deterministic contracts
        run: |
          node tools/phone_hands_queue_starvation_contract_test.mjs
          node tools/reality_membrane_contract_test.mjs
          node tools/reality_membrane_runtime_sources_test.mjs
          node tools/reality_membrane_service_test.mjs
          node tools/reality_membrane_runtime_patch_test.mjs
          node --check functions/phone_hands_relay.js
          node --check functions/home_center_mcp.js
          node --check functions/reality_membrane.js
          node --check functions/reality_membrane_runtime.js
          node --check functions/reality_membrane_service.js

      - name: Enforce bounded mutation set
        id: bounded
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf 'changed_count=%s\n' "${#changed[@]}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              functions/phone_hands_relay.js|functions/home_center_mcp.js) ;;
              *) echo "Unexpected mutation: $path" >&2; exit 1 ;;
            esac
          done
          if [ "${#changed[@]}" -ne 0 ] && [ "${#changed[@]}" -ne 2 ]; then
            echo "Expected zero idempotent changes or both canonical source files; got ${#changed[@]}." >&2
            exit 1
          fi

      - name: Commit applied source changes
        shell: bash
        run: |
          git config user.name "home-center-reality-membrane[bot]"
          git config user.email "home-center-reality-membrane[bot]@users.noreply.github.com"
          git add functions/phone_hands_relay.js functions/home_center_mcp.js
          if git diff --cached --quiet; then
            echo "Canonical source patches were already committed."
          else
            git commit -m "Wire Reality Membrane observe history and repair Phone Hands queue"
            git push origin HEAD:reality-membrane-canary-20260813
          fi

      - name: Capture implementation evidence
        shell: bash
        run: |
          {
            echo "## Reality Membrane checkpoint runner PASS"
            echo
            echo "- Authorized lane: Home Center GitHub Admin -> dispatched bounded branch mutation"
            echo "- Branch: \`reality-membrane-canary-20260813\`"
            echo "- Head SHA after mutation: \`$(git rev-parse HEAD)\`"
            echo "- Canonical operations wired: \`reality.status\`, \`reality.observe\`, \`reality.history\`, \`reality.sources\`, \`reality.capabilities\`"
            echo "- Phone Hands queue starvation repair: applied and idempotent"
            echo "- Deterministic core/runtime/service/privacy/staleness/accessibility contracts: PASS"
            echo "- Node syntax checks: PASS"
            echo "- Mutation boundary: only \`functions/phone_hands_relay.js\` and \`functions/home_center_mcp.js\` were generated by patchers"
            echo "- Acceptance boundary: this runner proves implementation and deterministic testing only; deployment and live canary receipts remain separate"
            echo
            echo "### Existing deployment-lane archaeology"
            echo "Workflow files mentioning Firebase or Cloud Functions:"
            grep -RIlE 'firebase deploy|gcloud functions deploy|phoneHandsRelay|homeCenterMcp' .github/workflows 2>/dev/null | sed 's/^/- `/' | sed 's/$/`/' || true
            echo
            echo "Referenced secret names (names only, never values):"
            grep -RhoE 'secrets\.[A-Za-z0-9_]+' .github/workflows 2>/dev/null | sort -u | sed 's/^/- `/' | sed 's/$/`/' || true
          } > /tmp/reality-checkpoint-comment.md
          cat /tmp/reality-checkpoint-comment.md

      - name: Publish durable PR receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 267 --repo Valar05/home-center --body-file /tmp/reality-checkpoint-comment.md
