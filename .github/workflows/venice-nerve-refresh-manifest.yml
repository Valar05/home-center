name: Venice Nerve Manifest Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'functions/home_center_mcp.js'
      - 'functions/venice_nerve_api.js'
      - 'contracts/home-center-top-level-mcp.v1.json'
      - 'contracts/home-center-public-tool-manifest.v1.json'
      - '.github/workflows/venice-nerve-refresh-manifest.yml'

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts
      - name: Verify canonical Home Center MCP baseline
        run: node tools/generate_home_center_public_manifest.mjs --check
