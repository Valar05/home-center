name: Venice Nerve Refresh Manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: venice-nerve-media-presence-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        run: npm --prefix functions ci --ignore-scripts
      - name: Regenerate intentional public MCP baselines
        run: node tools/generate_home_center_public_manifest.mjs
      - name: Verify regenerated baselines
        run: node tools/generate_home_center_public_manifest.mjs --check
      - name: Commit manifest and baseline only
        run: |
          if git diff --quiet -- contracts/home-center-top-level-mcp.v1.json contracts/home-center-public-tool-manifest.v1.json; then
            echo 'Public MCP baseline already current.'
            exit 0
          fi
          git diff --check -- contracts/home-center-top-level-mcp.v1.json contracts/home-center-public-tool-manifest.v1.json
          git config user.name 'home-center-actions'
          git config user.email 'home-center-actions@users.noreply.github.com'
          git add contracts/home-center-top-level-mcp.v1.json contracts/home-center-public-tool-manifest.v1.json
          git commit -m 'Refresh Home Center manifest for Venice Nerve'
          git push origin HEAD:venice-nerve-media-presence-v2
