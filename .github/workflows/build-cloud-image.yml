name: Build Cloud Runtime Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: cloud-render or cloud-worker
        required: true
        type: choice
        options: [cloud-render, cloud-worker]
      project:
        description: GCP project id
        required: true
        default: home-center-dclar
      region:
        description: Artifact Registry region
        required: true
        default: us-central1
      tag:
        description: Image tag
        required: true
        default: manual

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build with Cloud Build cache lane
        run: |
          target="${{ inputs.target }}"
          case "$target" in
            cloud-worker)
              config="cloud-worker/cloudbuild.yaml"
              image="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project }}/command-center-workers/debian-codex:${{ inputs.tag }}"
              ;;
            cloud-render)
              config="cloud-render/cloudbuild.yaml"
              image="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project }}/command-center-workers/blender-render:${{ inputs.tag }}"
              ;;
            *) echo "Unsupported target: $target" >&2; exit 2 ;;
          esac
          build_id="$(gcloud builds submit . --project "${{ inputs.project }}" --config "$config" --substitutions=_IMAGE="$image" --async --format='value(id)')"
          echo "Cloud Build id: $build_id"
          for attempt in $(seq 1 120); do
            status="$(gcloud builds describe "$build_id" --project "${{ inputs.project }}" --format='value(status)')"
            echo "Cloud Build status: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            sleep 10
          done
          echo "Cloud Build did not finish before polling timeout." >&2
          exit 1
