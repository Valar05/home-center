name: Eve Humane Session Daemon

on:
  pull_request:
    paths:
      - 'tools/eve_humane_session_daemon.py'
      - 'tools/test_eve_humane_session_daemon.py'
      - 'tools/setup_eve_humane_session_daemon.sh'
      - '.github/workflows/eve-humane-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax
        run: python -m py_compile tools/eve_humane_session_daemon.py tools/test_eve_humane_session_daemon.py
      - name: Scheduler tests
        run: python tools/test_eve_humane_session_daemon.py
      - name: Installer shell syntax
        run: bash -n tools/setup_eve_humane_session_daemon.sh
