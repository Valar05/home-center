name: Venice Nerve Integration

on:
  workflow_dispatch:
  push:
    branches:
      - venice-nerve-media-presence-v2
    paths:
      - 'functions/venice_nerve_api.js'
      - 'functions/venice_nerve_api.test.js'
      - 'venice-nerve/windows/**'
      - '.github/workflows/venice-nerve-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: venice-nerve-media-presence-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install function dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Install optional package dependencies
        run: |
          if [ -f browser-worker/package-lock.json ]; then npm --prefix browser-worker ci --ignore-scripts; fi
      - name: Wire dedicated Venice Nerve into Home Center
        shell: python
        run: |
          from pathlib import Path
          import json

          mcp_path = Path('functions/home_center_mcp.js')
          mcp = mcp_path.read_text()
          nerve_import = "const {veniceNerveOperationEntries, veniceNerveOperationRunOperation} = require('./venice_nerve_api');"
          body_import = "const {veniceBodyOperationEntries, veniceBodyOperationRunOperation} = require('./venice_body_router');"
          if nerve_import not in mcp:
              assert body_import in mcp
              mcp = mcp.replace(body_import, body_import + '\n' + nerve_import, 1)
          if '...veniceNerveOperationEntries()' not in mcp:
              anchor = '    ...veniceBodyOperationEntries(),'
              assert anchor in mcp
              mcp = mcp.replace(anchor, anchor + '\n    ...veniceNerveOperationEntries(),', 1)
          if 'veniceNerveOperationRunOperation({' not in mcp:
              anchor = "    const result = await veniceBodyOperationRunOperation({extra, admin, user, operation, args: operationArgs});\n    return {operation, registryVersion: registry.version, completed: true, result};\n  }"
              assert anchor in mcp
              block = "\n  if (veniceNerveOperationEntries()[operation]) {\n    requireCreditGatedEmail(user && user.email, operation);\n    const result = await veniceNerveOperationRunOperation({admin, user, operation, args: operationArgs});\n    return {operation, registryVersion: registry.version, completed: true, result};\n  }"
              mcp = mcp.replace(anchor, anchor + block, 1)
          mcp_path.write_text(mcp)

          index_path = Path('functions/index.js')
          index = index_path.read_text()
          hands_import = "const {createComputerHandsHandler} = require('./computer_hands_api');"
          nerve_handler_import = "const {createVeniceNerveHandler} = require('./venice_nerve_api');"
          if nerve_handler_import not in index:
              assert hands_import in index
              index = index.replace(hands_import, hands_import + '\n' + nerve_handler_import, 1)
          hands_export = "exports.computerHands = onRequest({timeoutSeconds: 300}, createComputerHandsHandler({admin}));"
          nerve_export = "exports.veniceNerve = onRequest({timeoutSeconds: 300}, createVeniceNerveHandler({admin}));"
          if nerve_export not in index:
              assert hands_export in index
              index = index.replace(hands_export, hands_export + '\n' + nerve_export, 1)
          index_path.write_text(index)

          package_path = Path('functions/package.json')
          package = json.loads(package_path.read_text())
          lint = package.get('scripts', {}).get('lint', '')
          if 'node --check venice_nerve_api.js' not in lint:
              assert lint.strip()
              package['scripts']['lint'] = lint + ' && node --check venice_nerve_api.js'
              package_path.write_text(json.dumps(package, indent=2) + '\n')
      - name: Refresh intentional public MCP baseline
        run: |
          node tools/generate_home_center_public_manifest.mjs
          node tools/generate_home_center_public_manifest.mjs --check
      - name: Validate Nerve contracts
        run: |
          node --check functions/venice_nerve_api.js
          node --check functions/home_center_mcp.js
          node --check functions/index.js
          node --test functions/venice_nerve_api.test.js
          grep -q "veniceNerveOperationEntries" functions/home_center_mcp.js
          grep -q "exports.veniceNerve" functions/index.js
          if grep -Eq "computer_hands_api|computerHandsOperation|windows-hands-01" functions/venice_nerve_api.js; then
            echo 'Venice Nerve may not share the Computer Hands transport.' >&2
            exit 1
          fi
          git diff --check
      - name: Commit explicit MCP wiring and manifest
        run: |
          if ! git diff --quiet -- functions/home_center_mcp.js functions/index.js functions/package.json contracts/home-center-top-level-mcp.v1.json contracts/home-center-public-tool-manifest.v1.json; then
            git config user.name 'home-center-actions'
            git config user.email 'home-center-actions@users.noreply.github.com'
            git add functions/home_center_mcp.js functions/index.js functions/package.json contracts/home-center-top-level-mcp.v1.json contracts/home-center-public-tool-manifest.v1.json
            git commit -m 'Wire Venice Nerve and refresh Home Center manifest'
            git push origin HEAD:venice-nerve-media-presence-v2
          fi
      - name: Diagnose worker profile contract
        run: |
          set +e
          output="$(node tools/worker_profile_contract_test.mjs 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            first="$(printf '%s' "$output" | tail -n 18 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Worker profile assertion::$first"
            exit "$code"
          fi
      - name: Diagnose full Home Center CI
        run: |
          if sh tools/home_center_ci_validate.sh; then
            exit 0
          fi
          report=generated/ci-reports/home_center_ci_validate.json
          if [ -f "$report" ]; then
            failed="$(node -e "const x=require('./$report'); process.stdout.write(x.failedStep || 'unknown')")"
            echo "::error title=Home Center CI failed step::$failed"
            cat "$report"
          else
            echo "::error title=Home Center CI failed step::report was not produced"
          fi
          exit 1
