name: Ritsu E2E Git Campaign Contract
on:
  push:
    branches: ['feature/ritsu-command-bridge-scavenge-20261022']
    paths:
      - 'tools/campaigns/ritsu-e2e-*'
      - '.github/workflows/ritsu-e2e-git-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-parse-and-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse campaign in Windows PowerShell 5.1
        shell: powershell
        run: |
          $script=Join-Path $PWD 'tools/campaigns/ritsu-e2e-campaign.ps1'
          $tokens=$null
          $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Host ('PARSE_ERROR line '+$_.Extent.StartLineNumber+' col '+$_.Extent.StartColumnNumber+': '+$_.Message)};throw 'PowerShell parse failed'}
          if(-not $ast){throw 'No campaign AST'}
          $contract=Get-Content 'tools/campaigns/ritsu-e2e-contract.json' -Raw|ConvertFrom-Json
          if($contract.campaignId -ne 'ritsu-chat-voice-e2e'){throw 'Wrong campaign contract'}
          if($contract.execution.originalAudio -notmatch '19643'){throw 'Lost protected voice path'}
          $body=Get-Content $script -Raw
          foreach($marker in @('pinned','worktree','Get-ScheduledTask','Start-ScheduledTask','Receipt','19646','19643','Stop-ScheduledTask')){
            if(-not $body.Contains($marker)){throw ('Missing contractual marker '+$marker)}
          }
          if($body.Contains('Start-Process')){throw 'Use independent scheduled task, not inherited stdout Process'}
          Write-Output 'RITSU_CAMPAIGN_WINDOWS_PARSE_OK'
      - name: Read-only plan is callable
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/campaigns/ritsu-e2e-campaign.ps1 -Mode Plan
          if($LASTEXITCODE -ne 0){throw 'Read-only plan failed'}
