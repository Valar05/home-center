name: Refresh Home Center MCP manifest on dispatch branch
on:
  push:
    branches:
      - codex/home-center-native-phone-dispatch-20261021
    paths:
      - '.github/workflows/refresh-home-center-dispatch-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-center-native-phone-dispatch-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - run: node tools/generate_home_center_public_manifest.mjs
      - run: node tools/generate_home_center_public_manifest.mjs --check
      - name: Commit generated contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/home-center-top-level-mcp.v1.json contracts/home-center-public-tool-manifest.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Home Center public MCP contract baseline"
            git push origin HEAD:codex/home-center-native-phone-dispatch-20261021
          fi
