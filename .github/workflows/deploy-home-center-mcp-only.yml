name: Deploy Home Center MCP Only

on:
  workflow_dispatch:
    inputs:
      project:
        description: GCP project id
        required: true
        default: home-center-dclar
      region:
        description: GCP region
        required: true
        default: us-central1
      confirm:
        description: Type deploy to confirm
        required: true

permissions:
  contents: read
  id-token: write

# All workflows that can write homeCenterMcp must share one target-level lock.
# The bounded MCP-only release is authoritative and cancels stale broader writers.
concurrency:
  group: deploy-home-center-mcp
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project || 'home-center-dclar' }}
      REGION: ${{ inputs.region || 'us-central1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Normalize fresh runner checkout and diagnose release tree
        run: |
          echo "Checkout status before normalization:"
          git status --short --untracked-files=all
          # Ephemeral GitHub-hosted runner: no user files exist to preserve.
          # Two legacy video blobs are committed as regular Git content even
          # though inherited .gitattributes marks them LFS. On a fresh runner
          # Git LFS would rewrite them as pointers and falsely mark checkout
          # dirty, blocking every main-only Home Center MCP deployment.
          # Override ONLY these two filters in ephemeral .git/info/attributes.
          # Never alter tracked .gitattributes, stored media, or local machines.
          attrs="$(git rev-parse --git-path info/attributes)"
          mkdir -p "$(dirname "$attrs")"
          cat >> "$attrs" <<'RITSU_LFS_RAW_LEGACY'
          experiments/ascii-kinesis/001-backward-stairs/backward-stairs-ascii.mp4 -filter -diff -merge
          experiments/ascii-kinesis/v2-locomotion-002-overhead-support-handoff/overhead-support-handoff.mp4 -filter -diff -merge
          RITSU_LFS_RAW_LEGACY
          # Rehydrate the exact checked-out commit and discard checkout artifacts.
          git reset --hard HEAD
          git clean -fd
          echo "Checkout status after normalization:"
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Enforce immutable main release source
        run: sh tools/assert_home_center_mcp_main_release.sh "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Validate Home Center MCP source
        run: |
          node --check functions/computer_hands_api.js
          node --check functions/index.js
          node --test functions/computer_hands_shared_lanes.test.js
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy only Home Center MCP
        env:
          GCLOUD_FUNCTIONS_REGION: ${{ env.REGION }}
          COMMAND_CENTER_MCP_URL: https://${{ env.REGION }}-${{ env.PROJECT }}.cloudfunctions.net/commandCenterMcp/mcp
          HOME_CENTER_GITHUB_ADMIN_USER_PROFILES_B64: ${{ secrets.HOME_CENTER_GITHUB_ADMIN_USER_PROFILES_B64 }}
        run: sh tools/deploy_functions_termux.sh "$PROJECT" homeCenterMcp
      - name: Verify deployed function exists
        run: |
          gcloud functions describe homeCenterMcp --gen2 --project="$PROJECT" --region="$REGION" --format='value(state,serviceConfig.uri)'
