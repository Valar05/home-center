name: Converge Phone Hands queue repair

on:
  workflow_dispatch:
  push:
    branches:
      - phone-hands-queue-starvation-converged-20260813
    paths:
      - .github/workflows/converge-phone-hands-queue-hotfix.yml

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: converge-phone-hands-queue-repair
  cancel-in-progress: false

env:
  BRANCH: phone-hands-queue-starvation-converged-20260813
  CANARY_COMMAND_ID: phc_queue_recovery_canary4_20260813
  CANARY_MARKER: PHONE_HANDS_QUEUE_RECOVERED_4
  HC_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOME_CENTER_DCLAR }}
  HC_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  HC_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  HC_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  HC_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
  HC_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  HC_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GH_TOKEN: ${{ github.token }}

jobs:
  repair-deploy-prove-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone-hands-queue-starvation-converged-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Commit repaired relay source before deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'home-center-github-admin[bot]'
          git config user.email 'home-center-github-admin[bot]@users.noreply.github.com'

          build_commit() {
            if grep -Fq ".limit(10).get()" functions/phone_hands_relay.js; then
              node tools/install_phone_hands_queue_starvation_fix.mjs
            fi
            node tools/phone_hands_queue_starvation_contract_test.mjs
            git diff --check
            git rm --ignore-unmatch .github/workflows/converge-phone-hands-queue-hotfix.yml
            git rm --ignore-unmatch tools/install_phone_hands_queue_starvation_fix.mjs
            git add functions/phone_hands_relay.js tools/phone_hands_queue_starvation_contract_test.mjs
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m 'Fix expired-command starvation in Phone Hands relay'
            fi
          }

          for attempt in $(seq 1 8); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            build_commit
            if git push origin HEAD:"$BRANCH"; then
              echo "DEPLOYED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              echo 'PHONE_HANDS_SOURCE_CONVERGED'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'PHONE_HANDS_SOURCE_CONVERGENCE_EXHAUSTED' >&2
          exit 42

      - name: Authenticate with workload identity when configured
        if: env.HC_WIF_PROVIDER != '' && env.HC_WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.HC_WIF_PROVIDER }}
          service_account: ${{ env.HC_WIF_SERVICE_ACCOUNT }}

      - name: Select Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HC_WIF_PROVIDER}" ] && [ -n "${HC_WIF_SERVICE_ACCOUNT}" ]; then
            echo 'AUTH_MODE=workload_identity' >> "$GITHUB_ENV"
            exit 0
          fi
          credential=''
          for candidate in "$HC_FIREBASE_SA" "$HC_GOOGLE_CREDENTIALS" "$HC_GCP_SA_KEY" "$HC_FIREBASE_SERVICE_ACCOUNT"; do
            if [ -n "$candidate" ]; then credential="$candidate"; break; fi
          done
          if [ -n "$credential" ]; then
            path="$RUNNER_TEMP/home-center-firebase-service-account.json"
            printf '%s' "$credential" > "$path"
            chmod 600 "$path"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$path" >> "$GITHUB_ENV"
            echo 'AUTH_MODE=service_account_json' >> "$GITHUB_ENV"
          elif [ -n "$HC_FIREBASE_TOKEN" ]; then
            echo 'AUTH_MODE=firebase_token' >> "$GITHUB_ENV"
          else
            echo 'No recognized Firebase/GCP deployment credential is configured.' >&2
            exit 41
          fi

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Deploy the exact repaired Phone Hands relay SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SOURCE_SHA"
          node tools/phone_hands_queue_starvation_contract_test.mjs
          if [ "$AUTH_MODE" = 'firebase_token' ]; then
            npx --yes firebase-tools@latest deploy --project home-center-dclar --only functions:phoneHandsRelay --non-interactive --token "$HC_FIREBASE_TOKEN"
          else
            npx --yes firebase-tools@latest deploy --project home-center-dclar --only functions:phoneHandsRelay --non-interactive
          fi

      - name: Require a live primary-phone terminal canary
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const admin = require('firebase-admin');
          if (!admin.apps.length) admin.initializeApp({projectId:'home-center-dclar'});
          const db = admin.firestore();
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const cleanCommand = (command) => {
            if (!command) return null;
            const result = command.result || {};
            return {
              commandId: command.commandId || '',
              deviceId: command.deviceId || '',
              status: command.status || '',
              action: command.action && command.action.action || '',
              createdAtMs: Number(command.createdAtMs || 0),
              updatedAtMs: Number(command.updatedAtMs || 0),
              completedAtMs: Number(command.completedAtMs || 0),
              expiresAtMs: Number(command.expiresAtMs || 0),
              error: String(command.error || ''),
              result: {
                ok: result.ok === true,
                exitCode: Number(result.exitCode),
                stdout: String(result.stdout || '').trim(),
                stderr: String(result.stderr || '').trim(),
              },
            };
          };
          (async () => {
            const commandId = process.env.CANARY_COMMAND_ID;
            const deadline = Date.now() + 12 * 60 * 1000;
            let command = null;
            while (Date.now() < deadline) {
              const snap = await db.collection('phoneHandsCommands').doc(commandId).get();
              command = snap.exists ? snap.data() : null;
              if (command && ['completed','failed'].includes(command.status)) break;
              await sleep(4000);
            }
            const receiptCommand = cleanCommand(command);
            if (!receiptCommand || receiptCommand.status !== 'completed' || receiptCommand.result.ok !== true || receiptCommand.result.exitCode !== 0 || !receiptCommand.result.stdout.includes(process.env.CANARY_MARKER)) {
              throw new Error('phone_hands_queue_canary_invalid:' + JSON.stringify(receiptCommand));
            }
            const deviceSnap = await db.collection('phoneHandsDevices').doc('primary-phone').get();
            if (!deviceSnap.exists) throw new Error('primary_phone_missing');
            const device = deviceSnap.data() || {};
            const heartbeatAgeMs = Date.now() - Number(device.lastSeenAtMs || 0);
            if (device.status !== 'online' || !Number.isFinite(heartbeatAgeMs) || heartbeatAgeMs > 120000) {
              throw new Error(`primary_phone_not_fresh:${device.status}:${heartbeatAgeMs}`);
            }
            const backlogIds = [
              'phc_9cde2d7d-db5a-4ae5-9f72-42d4a63e650f',
              'phc_fa9edcf6-406e-470e-aaf4-60512e582d61',
              'phc_phone_hands_hotfix_apply_20260813',
            ];
            const backlog = [];
            for (const id of backlogIds) {
              const snap = await db.collection('phoneHandsCommands').doc(id).get();
              backlog.push(cleanCommand(snap.exists ? snap.data() : null));
            }
            const receipt = {
              schema:'home-center.phone-hands-queue-hotfix.converged-receipt.v1',
              observedAt:new Date().toISOString(),
              deployment:{
                repository:process.env.GITHUB_REPOSITORY,
                sourceSha:process.env.DEPLOYED_SOURCE_SHA,
                runId:process.env.GITHUB_RUN_ID,
                project:'home-center-dclar',
                function:'phoneHandsRelay',
              },
              canary:receiptCommand,
              device:{
                deviceId:device.deviceId || 'primary-phone',
                status:device.status,
                lastSeenAtMs:Number(device.lastSeenAtMs || 0),
                heartbeatAgeMs,
                capabilities:Array.isArray(device.capabilities) ? device.capabilities : [],
              },
              sampledPriorBacklog:backlog,
              checks:{
                sourceContractPassed:true,
                deployedExactSha:true,
                liveQueueLeasePassed:true,
                termuxExecutionPassed:true,
                freshHeartbeatPassed:true,
                expiredEvidenceDeletionUsed:false,
              },
              evidenceBoundary:'The live Phone Hands command and device heartbeat are acceptance evidence. The workflow status is not.',
            };
            receipt.receiptSha256 = crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/phone-hands-queue-hotfix-receipt.json', JSON.stringify(receipt,null,2) + '\n');
            console.log(JSON.stringify(receipt));
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE

      - name: Commit the durable live receipt from a clean branch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p docs/evidence
            cp "$RUNNER_TEMP/phone-hands-queue-hotfix-receipt.json" docs/evidence/phone-hands-queue-hotfix-converged-20260813.json
            git add docs/evidence/phone-hands-queue-hotfix-converged-20260813.json
            git diff --cached --check
            git commit -m 'Record live Phone Hands queue recovery receipt'
            if git push origin HEAD:"$BRANCH"; then
              echo 'PHONE_HANDS_RECEIPT_PUSHED'
              break
            fi
            if [ "$attempt" -eq 8 ]; then exit 44; fi
            sleep $((attempt * 3))
          done

      - name: Open, document, and merge the isolated hotfix
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title 'Fix expired-command starvation in Phone Hands relay' --body 'Isolated infrastructure hotfix. It terminalizes expired queued commands without deleting evidence, preserves fresh command leaseability, includes a deterministic source contract test, deploys one exact relay SHA, and requires a live primary-phone Termux receipt before merge. Reality Membrane PR #267 remains separate.'
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file docs/evidence/phone-hands-queue-hotfix-converged-20260813.json
          head_sha=$(git rev-parse HEAD)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=squash -f sha="$head_sha" | jq -e '.merged == true'
