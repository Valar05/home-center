name: Repair Phone Hands Queue Starvation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-phone-hands-queue-starvation.yml'
  workflow_dispatch:
    inputs:
      project:
        description: GCP project id
        required: true
        default: home-center-dclar
      region:
        description: GCP region
        required: true
        default: us-central1
      confirm:
        description: Type repair to confirm
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: repair-phone-hands-relay
  cancel-in-progress: false

jobs:
  repair-deploy-prove:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-phone-queue-repair]')) || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'repair') }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project || 'home-center-dclar' }}
      REGION: ${{ inputs.region || 'us-central1' }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          lfs: false
          sparse-checkout: |
            functions
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm --prefix functions ci

      - name: Patch only the proven queue-starvation defect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('functions/phone_hands_relay.js')
          text = path.read_text()
          old = """  const query = await admin.firestore().collection(COLLECTIONS.commands)\n    .where('ownerKey','==',device.ownerKey).where('deviceId','==',id).where('status','==','queued').limit(10).get();\n  const candidates = query.docs.map((d) => d.data()).filter((x) => Number(x.expiresAtMs || 0) > now).sort((a,b) => a.createdAtMs-b.createdAtMs);\n  if (!candidates.length) return {ok: true, command: null};\n"""
          new = """  const query = await admin.firestore().collection(COLLECTIONS.commands)\n    .where('ownerKey','==',device.ownerKey).where('deviceId','==',id).where('status','==','queued').limit(100).get();\n  const queued = query.docs.map((d) => d.data()).sort((a,b) => a.createdAtMs-b.createdAtMs);\n  const expired = queued.filter((x) => Number(x.expiresAtMs || 0) <= now);\n  if (expired.length) {\n    const batch = admin.firestore().batch();\n    for (const command of expired.slice(0, 80)) {\n      if (!command.commandId) continue;\n      batch.set(admin.firestore().collection(COLLECTIONS.commands).doc(command.commandId), {\n        status:'failed', error:'expired_before_lease', completedAtMs:now, updatedAtMs:now, leaseExpiresAtMs:0,\n      }, {merge:true});\n    }\n    await batch.commit();\n  }\n  const candidates = queued.filter((x) => Number(x.expiresAtMs || 0) > now);\n  if (!candidates.length) return {ok: true, command: null};\n"""
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new))
              print('PATCH_APPLIED=1')
          elif "error:'expired_before_lease'" in text and ".limit(100).get()" in text:
              print('PATCH_ALREADY_PRESENT=1')
          else:
              raise SystemExit(f'BLOCKED: expected stale queue snippet exactly once, found {count}')
          PY

      - name: Contract and syntax gate
        run: |
          node --check functions/phone_hands_relay.js
          grep -Fq ".where('ownerKey','==',device.ownerKey).where('deviceId','==',id).where('status','==','queued').limit(100).get()" functions/phone_hands_relay.js
          grep -Fq "error:'expired_before_lease'" functions/phone_hands_relay.js
          if grep -Fq ".where('ownerKey','==',device.ownerKey).where('deviceId','==',id).where('status','==','queued').limit(10).get()" functions/phone_hands_relay.js; then
            echo 'BLOCKED: stale limit(10) queue pull remains' >&2
            exit 1
          fi

      - name: Commit source repair before deployment
        run: |
          if git diff --quiet -- functions/phone_hands_relay.js; then
            echo 'SOURCE_ALREADY_REPAIRED=1'
          else
            git config user.name 'home-center-repair-bot'
            git config user.email 'home-center-repair-bot@users.noreply.github.com'
            git add functions/phone_hands_relay.js
            git commit -m 'Fix Phone Hands expired queue starvation'
            git push origin HEAD:main
          fi
          git status --short
          git rev-parse HEAD

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy only phoneHandsRelay
        run: |
          gcloud functions deploy phoneHandsRelay \
            --gen2 \
            --project="$PROJECT" \
            --region="$REGION" \
            --runtime=nodejs22 \
            --source="$GITHUB_WORKSPACE/functions" \
            --entry-point=phoneHandsRelay \
            --trigger-http \
            --allow-unauthenticated \
            --timeout=120s

      - name: Verify deployed relay
        run: |
          gcloud functions describe phoneHandsRelay --gen2 --project="$PROJECT" --region="$REGION" --format='value(state,serviceConfig.uri)'
          echo "DEPLOYED_SOURCE=$(git rev-parse HEAD)"
