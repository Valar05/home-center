name: Verify Ritsu Runtime Contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run no-GPU local voice safety regression tests
        run: |
          python -m unittest discover -s workers -p 'test_ritsu_*worker.py' -v
          python -m unittest discover -s workers -p 'test_ritsu_voice_runtime_contract.py' -v
          python -m py_compile tools/campaigns/ritsu_voice_api_repertoire_v1.py tools/campaigns/ritsu_say_repertoire_v1.py tools/campaigns/ritsu_warm_api_supervisor.py workers/ritsu_warm_ticket_worker.py
