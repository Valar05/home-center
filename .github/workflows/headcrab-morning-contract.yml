name: Headcrab contracts

on:
  pull_request:
    paths:
      - 'tools/headcrab_morning.py'
      - 'tools/test_headcrab_morning.py'
      - 'tools/headcrab_obligations.py'
      - 'tools/test_headcrab_obligations.py'
      - 'functions/headcrab_reminder_store.js'
      - 'tools/headcrab_reminder_store.test.js'\n      - 'tools/headcrab_pr384_campaign.sh'
      - 'functions/home_center_mcp.js'
      - 'SKILLS.md'
      - 'docs/doctrine/HEADCRAB_ATTENTION_OPERATOR.md'
      - '.github/workflows/headcrab-morning-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Headcrab contracts
        run: |
          python3 tools/test_headcrab_morning.py
          python3 tools/test_headcrab_obligations.py
          node --test tools/headcrab_reminder_store.test.js\n          bash -n tools/headcrab_pr384_campaign.sh
