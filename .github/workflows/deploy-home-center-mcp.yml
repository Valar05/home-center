name: Deploy Home Center MCP

on:
  push:
    branches:
      - deploy/audio-ingest-pr88
  workflow_dispatch:
    inputs:
      project:
        description: GCP project id
        required: true
        default: home-center-dclar
      region:
        description: GCP region
        required: true
        default: us-central1
      confirm:
        description: Type deploy to confirm
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Home Center audio services
        env:
          GCLOUD_FUNCTIONS_REGION: us-central1
          COMMAND_CENTER_MCP_URL: https://us-central1-home-center-dclar.cloudfunctions.net/commandCenterMcp/mcp
        run: sh tools/deploy_functions_termux.sh "home-center-dclar" homeCenterMcp audioLibraryApi
