name: Deploy Home Center MCP

on:
  push:
    branches:
      - agent/household-evidence-spine
    paths:
      - .github/workflows/deploy-home-center-mcp.yml
      - tools/deploy_functions_termux.sh
  workflow_dispatch:
    inputs:
      project:
        description: GCP project id
        required: true
        default: home-center-dclar
      region:
        description: GCP region
        required: true
        default: us-central1
      confirm:
        description: Type deploy to confirm
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-home-center-mcp
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project || 'home-center-dclar' }}
      REGION: ${{ inputs.region || 'us-central1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Home Center services
        env:
          GCLOUD_FUNCTIONS_REGION: ${{ env.REGION }}
          COMMAND_CENTER_MCP_URL: https://${{ env.REGION }}-${{ env.PROJECT }}.cloudfunctions.net/commandCenterMcp/mcp
        run: sh tools/deploy_functions_termux.sh "$PROJECT" homeCenterMcp audioLibraryApi
