name: Deploy Home Center MCP

on:
  workflow_dispatch:
    inputs:
      project:
        description: GCP project id
        required: true
        default: home-center-dclar
      region:
        description: GCP region
        required: true
        default: us-central1
      confirm:
        description: Type deploy to confirm
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-home-center-mcp
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project || 'home-center-dclar' }}
      REGION: ${{ inputs.region || 'us-central1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - name: Verify Cloud Run Blender authoring contract
        run: |
          node --check cloud-render/src/render_bundle.mjs
          node --check cloud-render/src/server.mjs
          node --check functions/command_center_mcp.js
          node --check functions/home_center_mcp.js
          python3 -m py_compile factory/sherman-cleanroom-cloudrun-a/build_sherman_cleanroom_a.py
          node tools/cloud_run_blender_build_contract_test.mjs
          node tools/worker_profile_contract_test.mjs
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy corrected Cloud Run Blender revision in place
        env:
          GCLOUD_REGION: ${{ env.REGION }}
          COMMAND_CENTER_RENDER_SERVICE: command-center-blender-render
          COMMAND_CENTER_SKIP_SERVICE_ENABLE: "true"
        run: sh tools/deploy_command_center_blender_render.sh "$PROJECT"
      - name: Deploy Home Center MCP bridge
        env:
          GCLOUD_FUNCTIONS_REGION: ${{ env.REGION }}
          COMMAND_CENTER_MCP_URL: https://${{ env.REGION }}-${{ env.PROJECT }}.cloudfunctions.net/commandCenterMcp/mcp
        run: sh tools/deploy_functions_termux.sh "$PROJECT" homeCenterMcp
      - name: Verify dispatch and receipt services remain active
        run: |
          gcloud functions describe commandCenterMcp --gen2 --project "$PROJECT" --region "$REGION" --format='value(state)'
          gcloud functions describe commandCenterRenderWorker --gen2 --project "$PROJECT" --region "$REGION" --format='value(state)'
          gcloud functions describe homeCenterMcp --gen2 --project "$PROJECT" --region "$REGION" --format='value(state)'
