name: Fix Shared time.now Live

on:
  push:
    paths:
      - '.github/workflows/fix-time-now-live.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-home-center-mcp
  cancel-in-progress: true

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: home-center-dclar
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install shared time.now
        run: node tools/install_time_now_live.mjs

      - name: Validate Time Truth 1.1
        run: |
          node --check functions/home_center_mcp.js
          node tools/time_now_1_1_acceptance.mjs

      - name: Persist implementation
        run: |
          git config user.name 'home-center-release-bot'
          git config user.email 'home-center-release-bot@users.noreply.github.com'
          git add functions/home_center_mcp.js
          if git diff --cached --quiet; then
            echo 'time.now source already persisted'
          else
            git commit -m 'fix: expose shared time.now through drive operation'
            git push origin HEAD:main
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Home Center MCP
        env:
          GCLOUD_FUNCTIONS_REGION: ${{ env.REGION }}
          COMMAND_CENTER_MCP_URL: https://${{ env.REGION }}-${{ env.PROJECT }}.cloudfunctions.net/commandCenterMcp/mcp
          HOME_CENTER_GITHUB_ADMIN_USER_PROFILES_B64: ${{ secrets.HOME_CENTER_GITHUB_ADMIN_USER_PROFILES_B64 }}
        run: sh tools/deploy_functions_termux.sh "$PROJECT" homeCenterMcp

      - name: Verify deployed function exists
        run: gcloud functions describe homeCenterMcp --gen2 --project="$PROJECT" --region="$REGION" --format='value(state,serviceConfig.uri)'
