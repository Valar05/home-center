name: Home Center CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            browser-worker/package-lock.json
            cloud-render/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install function dependencies
        run: npm --prefix functions ci
      - name: Install optional package dependencies when lockfiles exist
        run: |
          for dir in browser-worker cloud-render cloud-worker; do
            if [ -f "$dir/package-lock.json" ]; then npm --prefix "$dir" ci; fi
          done
      - name: Run CI validation subset
        run: sh tools/home_center_ci_validate.sh
      - name: Upload CI report for manual failures
        if: failure() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: home-center-ci-report
          path: generated/ci-reports/
          retention-days: 1
