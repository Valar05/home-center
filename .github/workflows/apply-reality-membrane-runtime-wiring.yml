name: Apply Reality Membrane runtime wiring

on:
  push:
    branches:
      - reality-membrane-canary-20260813
    paths:
      - .github/workflows/apply-reality-membrane-runtime-wiring.yml

permissions:
  contents: write

concurrency:
  group: apply-reality-membrane-runtime-wiring
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reality-membrane-canary-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical drive_operation wiring
        run: node tools/install_reality_membrane_runtime_patch.mjs
      - name: Run deterministic Reality Membrane contracts
        run: |
          node tools/reality_membrane_contract_test.mjs
          node tools/reality_membrane_runtime_patch_test.mjs
      - name: Validate source diff
        run: git diff --check
      - name: Commit wired source and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'home-center-github-admin[bot]'
          git config user.email 'home-center-github-admin[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/apply-reality-membrane-runtime-wiring.yml
          git add functions/home_center_mcp.js functions/reality_membrane.js tools/install_reality_membrane_runtime_patch.mjs tools/reality_membrane_contract_test.mjs tools/reality_membrane_runtime_patch_test.mjs
          git diff --cached --check
          git commit -m 'Wire Reality Membrane status surfaces into Home Center'
          git push origin HEAD:reality-membrane-canary-20260813
