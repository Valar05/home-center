name: Patch Full Perspective Punnett

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-full-perspective-punnett
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        run: npm --prefix functions ci
      - name: Apply deterministic Regnet + Rene QA full-perspective Punnett patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`Missing patch anchor: ${label}`);
            if (text.indexOf(before, first + before.length) >= 0) throw new Error(`Ambiguous patch anchor: ${label}`);
            return text.slice(0, first) + after + text.slice(first + before.length);
          }

          const fortressPath = 'functions/home_center_fortress.js';
          let fortress = fs.readFileSync(fortressPath, 'utf8');

          fortress = replaceOnce(
            fortress,
            "const WORK_INTERROGATION_DOMAINS = new Set(['intent', 'constraint', 'acceptance', 'authority', 'taste']);\n",
            "const WORK_INTERROGATION_DOMAINS = new Set(['intent', 'constraint', 'acceptance', 'authority', 'taste']);\nconst FULL_PERSPECTIVE_VERSION = 'dru.punnett-regnet-reneqa.v1';\nconst INTERROGATION_AGENT_WORK_PATTERNS = Object.freeze([\n  {code: 'USER_FAILURE_TAX', pattern: /\\b(failure modes?|pre-?mortem|risk analysis|regressions?|verification strategy|test strategy|test plan)\\b/i},\n  {code: 'IMPLEMENTATION_TAX', pattern: /\\b(implementation|architecture|internal mechanics?|engine structure|distinct passes?|separate passes?|merge(?:d|s|ing)?|split(?:ting)?|refactor(?:ing)?)\\b/i},\n  {code: 'ENGINE_CHOICE_TAX', pattern: /\\bshould (?:the )?(?:engine|agent|system|fortress)\\s+(?:use|make|merge|split|replace|implement|structure)\\b/i},\n  {code: 'IMPLEMENTER_QUESTION', pattern: /\\bhow should (?:i|we)\\s+(?:implement|architect|structure|merge|split|refactor|test|verify)\\b/i},\n]);\n\nfunction fullPerspectiveInterrogationReview(question, domain) {\n  const hits = INTERROGATION_AGENT_WORK_PATTERNS\n    .filter((entry) => entry.pattern.test(question))\n    .map((entry) => entry.code);\n  if (hits.length) {\n    const failureKind = hits.includes('USER_FAILURE_TAX') ? 'user_failure_tax' : 'interrogation_implementation_tax';\n    const err = new Error('Punnett interrogation failed Regnet + Rene QA ownership review: the question pushes agent-owned implementation, failure analysis, regression, or verification work onto Drew.');\n    err.status = 400;\n    err.code = failureKind;\n    err.failureKind = failureKind;\n    err.details = {\n      version: FULL_PERSPECTIVE_VERSION,\n      mode: 'punnett_full_perspective',\n      verdict: 'FAIL',\n      domain,\n      hits,\n      regnet: 'The person is not the machinery. Ask for an affected-person need or user-owned constraint, not the mechanism the system can own.',\n      reneQa: 'A user-owned domain label cannot launder implementation, failure, regression, risk, test, or verification work into a valid interrogation.',\n    };\n    throw err;\n  }\n  return {\n    version: FULL_PERSPECTIVE_VERSION,\n    mode: 'punnett_full_perspective',\n    verdict: 'PASS',\n    domain,\n    passes: {\n      punnett: {\n        status: 'declared',\n        source: 'she-raw',\n        perspective: 'punnett',\n        executionClaim: 'not_proven_by_engine',\n        law: 'Exactly one question may request a user-owned variable.',\n      },\n      regnet: {\n        status: 'PASS',\n        law: 'The person is not the machinery; challenge respectable-looking questions that merely offload the system\'s mechanism.',\n        check: 'No agent-owned implementation/failure/verification work was detected in the proposed question.',\n      },\n      reneQa: {\n        status: 'PASS',\n        law: 'Scope fidelity applies to interrogation itself; intent/constraint/acceptance/authority/taste labels do not excuse wrong-owner work.',\n        check: 'Question stayed inside the declared user-owned domain and passed the agent-work tax screen.',\n      },\n    },\n  };\n}\n",
            'full perspective constants',
          );

          fortress = replaceOnce(
            fortress,
            "    answeredAtMs: Number(interrogation.answeredAtMs || 0) || 0,\n  };\n}",
            "    answeredAtMs: Number(interrogation.answeredAtMs || 0) || 0,\n    fullPerspective: safeObject(interrogation.fullPerspective),\n  };\n}",
            'public interrogation receipt',
          );

          fortress = replaceOnce(
            fortress,
            "  return {\n    required: true,\n    questionCount: 1,\n    source: 'she-raw',\n    perspective: 'punnett',\n    domain: normalizeInterrogationDomain(args.interrogationDomain),\n    question,\n",
            "  const domain = normalizeInterrogationDomain(args.interrogationDomain);\n  const fullPerspective = fullPerspectiveInterrogationReview(question, domain);\n  return {\n    required: true,\n    questionCount: 1,\n    source: 'she-raw',\n    perspective: 'punnett',\n    domain,\n    question,\n",
            'interrogation domain review',
          );

          fortress = replaceOnce(
            fortress,
            "    answeredAtMs: 0,\n  };\n}\n\nasync function loadWorkItem",
            "    answeredAtMs: 0,\n    fullPerspective,\n  };\n}\n\nasync function loadWorkItem",
            'persist full perspective receipt',
          );

          fs.writeFileSync(fortressPath, fortress);

          const testPath = 'functions/home_center_fortress.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          tests = replaceOnce(
            tests,
            "  assert.equal(requested.work.interrogation.answered, false);\n  assert.match(requested.work.receipt.receiptRef, /^firestore:\\\/\\\\/homeCenterWorkItems\\\\//);",
            "  assert.equal(requested.work.interrogation.answered, false);\n  assert.equal(requested.work.interrogation.fullPerspective.version, 'dru.punnett-regnet-reneqa.v1');\n  assert.equal(requested.work.interrogation.fullPerspective.mode, 'punnett_full_perspective');\n  assert.equal(requested.work.interrogation.fullPerspective.verdict, 'PASS');\n  assert.equal(requested.work.interrogation.fullPerspective.passes.regnet.status, 'PASS');\n  assert.equal(requested.work.interrogation.fullPerspective.passes.reneQa.status, 'PASS');\n  assert.equal(requested.work.interrogation.fullPerspective.passes.punnett.executionClaim, 'not_proven_by_engine');\n  assert.match(requested.work.receipt.receiptRef, /^firestore:\\\/\\\\/homeCenterWorkItems\\\\//);",
            'test full perspective receipt',
          );
          tests += `\n\ntest('Home Center full-perspective Punnett rejects internal implementation tax even when mislabeled as authority', async () => {\n  const admin = fakeAdmin();\n  const auth = extraAuth();\n  const server = createServer(admin);\n  await assert.rejects(\n    () => callRegisteredHomeCenterTool(server, 'home_center_work_request', {\n      taskId: 'implementation-tax-probe',\n      requestText: 'Update Regnet QA full perspective Punnett on the engine.',\n      taskKind: 'engine_patch_request',\n      route: 'fortress_session_probe',\n      interrogationQuestion: 'Should the engine make Regnet and Rene QA two distinct passes or merge them into one judgment pass?',\n      interrogationDomain: 'authority',\n    }, auth),\n    (error) => {\n      assert.equal(error.code, 'interrogation_implementation_tax');\n      assert.equal(error.details.verdict, 'FAIL');\n      assert.equal(error.details.mode, 'punnett_full_perspective');\n      return true;\n    },\n  );\n});\n\ntest('Home Center full-perspective Punnett keeps failure analysis inside Fortress', async () => {\n  const admin = fakeAdmin();\n  const auth = extraAuth();\n  const server = createServer(admin);\n  await assert.rejects(\n    () => callRegisteredHomeCenterTool(server, 'home_center_work_request', {\n      taskId: 'failure-tax-probe',\n      requestText: 'Build the thing.',\n      taskKind: 'general_work_request',\n      route: 'fortress_session_probe',\n      interrogationQuestion: 'What failure modes and regression risks should I anticipate?',\n      interrogationDomain: 'taste',\n    }, auth),\n    (error) => {\n      assert.equal(error.code, 'user_failure_tax');\n      assert.equal(error.details.verdict, 'FAIL');\n      return true;\n    },\n  );\n});\n`;
          fs.writeFileSync(testPath, tests);

          const rulePath = '.continue/rules/05-judgement-jar-simulation-trap.md';
          let rule = fs.readFileSync(rulePath, 'utf8');
          rule = replaceOnce(
            rule,
            "1. Route question selection through She-Raw with `requestedPerspective=Punnett`.\n2. Ask exactly one question. The domain must be user-owned intent, constraint, acceptance, authority, or taste.\n3. Never ask Drew for failure modes, implementation choices that Fortress can own, regressions, pre-mortem analysis, risk analysis, or verification strategy. Those are internal Fortress duties.",
            "1. Route question selection through She-Raw with `requestedPerspective=Punnett`.\n2. Before the question may be persisted or surfaced, run the engine's Regnet + Rene QA full-perspective ownership review. Regnet challenges the model behind the question: the person is not the machinery, so an affected-person need or user-owned constraint outranks a respectable-looking internal mechanism question. Rene QA then checks scope fidelity: a domain label cannot launder agent-owned implementation/failure/regression/verification work into a valid user question. Persist the PASS receipt with the interrogation.\n3. Ask exactly one question. The domain must be user-owned intent, constraint, acceptance, authority, or taste.\n4. Never ask Drew for failure modes, implementation choices that Fortress can own, regressions, pre-mortem analysis, risk analysis, or verification strategy. Those are internal Fortress duties. Mislabeling such work as taste or authority remains `USER_FAILURE_TAX` / `INTERROGATION_IMPLEMENTATION_TAX`.",
            'rule full perspective gate',
          );
          rule = rule.replace('4. Record the commission at the basic work unit', '5. Record the commission at the basic work unit')
            .replace('5. Surface that single question', '6. Surface that single question')
            .replace('6. The user\'s answer continues', '7. The user\'s answer continues')
            .replace('7. After the answer', '8. After the answer');
          rule = replaceOnce(
            rule,
            "`INTERROGATION_MULTIPLY` means more than one question was imposed. `USER_FAILURE_TAX` means Fortress outsourced its own failure analysis to Drew. `WORK_AFTER_STOP` means action continued after the commissioned state was satisfied.",
            "`INTERROGATION_MULTIPLY` means more than one question was imposed. `USER_FAILURE_TAX` means Fortress outsourced its own failure analysis to Drew. `INTERROGATION_IMPLEMENTATION_TAX` means the question made Drew choose internal engine/architecture/mechanism work that Fortress could own. `WORK_AFTER_STOP` means action continued after the commissioned state was satisfied.",
            'rule failure label',
          );
          rule = replaceOnce(
            rule,
            "- `USER_FAILURE_TAX`: failure analysis, implementation risk, regressions, or verification strategy are pushed back onto Drew.\n- `WORK_AFTER_STOP`:",
            "- `USER_FAILURE_TAX`: failure analysis, implementation risk, regressions, or verification strategy are pushed back onto Drew.\n- `INTERROGATION_IMPLEMENTATION_TAX`: a user-owned domain label is used to push internal engine architecture, merge/split strategy, or other implementer-owned mechanics onto Drew.\n- `WORK_AFTER_STOP`:",
            'rule failure list',
          );
          rule = replaceOnce(
            rule,
            "Every new work commission records exactly one Punnett-routed, user-authority-only interrogation question at `home_center_work_request`, remains `AWAITING_ANSWER` without execution on the first invocation, resumes the same task after the answer, keeps failure analysis inside Fortress, and stops when the requested state is satisfied.",
            "Every new work commission records exactly one Punnett-routed, user-authority-only interrogation question at `home_center_work_request`. Before persistence/surfacing, the engine records a Regnet + Rene QA full-perspective PASS receipt and rejects failure/implementation tax even when mislabeled as taste or authority. The work remains `AWAITING_ANSWER` without execution on the first invocation, resumes the same task after the answer, keeps failure analysis and internal mechanism choices inside Fortress, and stops when the requested state is satisfied.",
            'rule acceptance',
          );
          fs.writeFileSync(rulePath, rule);
          NODE
      - name: Validate source syntax
        run: node --check functions/home_center_fortress.js && node --check functions/home_center_fortress.test.js
      - name: Test Fortress Home Center
        run: npm --prefix functions run test:fortress-home-center
      - name: Run function lint
        run: npm --prefix functions run lint
      - name: Verify doctrine anchors
        run: |
          grep -F "dru.punnett-regnet-reneqa.v1" functions/home_center_fortress.js
          grep -F "INTERROGATION_IMPLEMENTATION_TAX" .continue/rules/05-judgement-jar-simulation-trap.md
          grep -F "executionClaim: 'not_proven_by_engine'" functions/home_center_fortress.js
      - name: Verify clean diff
        run: git diff --check
      - name: Commit engine update
        run: |
          git config user.name "home-center-dru-patcher"
          git config user.email "actions@users.noreply.github.com"
          git add functions/home_center_fortress.js functions/home_center_fortress.test.js .continue/rules/05-judgement-jar-simulation-trap.md
          git diff --cached --stat
          git commit -m "Enforce full-perspective Punnett ownership QA"
          git push origin HEAD:main
