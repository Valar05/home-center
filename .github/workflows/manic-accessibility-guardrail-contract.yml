name: Manic Accessibility Guardrail Contract

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AGENTS.base.md'
      - 'CODEX_STARTS_HERE.md'
      - 'CODEX_STARTS_HERE.base.md'
      - 'MEMORIES.md'
      - 'MEMORIES.base.md'
      - 'SKILLS.md'
      - 'SKILLS.base.md'
      - 'docs/MANIC_ACCESSIBILITY_GUARDRAIL.md'
      - 'skills/manic-accessibility-guardrail/**'
      - 'tools/manic_accessibility_guardrail*'
      - 'tools/manic_accessibility_boot*'
      - '.continue/rules/60-adam-personality-gate.md'
      - '.github/workflows/manic-accessibility-guardrail-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'AGENTS.base.md'
      - 'CODEX_STARTS_HERE.md'
      - 'CODEX_STARTS_HERE.base.md'
      - 'MEMORIES.md'
      - 'MEMORIES.base.md'
      - 'SKILLS.md'
      - 'SKILLS.base.md'
      - 'docs/MANIC_ACCESSIBILITY_GUARDRAIL.md'
      - 'skills/manic-accessibility-guardrail/**'
      - 'tools/manic_accessibility_guardrail*'
      - 'tools/manic_accessibility_boot*'
      - '.continue/rules/60-adam-personality-gate.md'
      - '.github/workflows/manic-accessibility-guardrail-contract.yml'

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check skills/manic-accessibility-guardrail/scripts/audit.mjs
          node --check skills/manic-accessibility-guardrail/scripts/communication-codec.mjs
          node --check tools/manic_accessibility_guardrail.mjs
          node --check tools/manic_accessibility_boot.mjs
      - name: Guardrail contracts
        run: node --test tools/manic_accessibility_guardrail.test.mjs tools/manic_accessibility_guardrail_codec.test.mjs tools/manic_accessibility_boot.test.mjs
      - name: Communication codec canaries
        run: |
          printf '%s\n' '{"atom":"canary","establishedEngineeringTerm":true,"sharedConcept":true}' \
            | node skills/manic-accessibility-guardrail/scripts/communication-codec.mjs \
            | tee /tmp/canary-codec.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/canary-codec.json","utf8"));if(r.policy!=="COMPACT_POINTER"||r.preserveExactAtom!==true||r.stopRule!=="STOP_WHEN_MEANING_LANDS")process.exit(1)'
          printf '%s\n' '{"atom":"ASMR","sharedConcept":true,"observedSemanticMismatch":true,"readbackAvailable":true}' \
            | node skills/manic-accessibility-guardrail/scripts/communication-codec.mjs \
            | tee /tmp/asmr-codec.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/asmr-codec.json","utf8"));if(r.policy!=="MINIMAL_GROUNDING"||r.verification!=="READBACK_OR_OBSERVE")process.exit(1)'
      - name: Interpretation safety canaries
        run: |
          printf '%s\n' '{"atom":"Dune","voiceToTextLikely":true,"namedEntityAmbiguity":true,"contextSupportsAlternate":true,"literalReadingEvidence":false}' \
            | node skills/manic-accessibility-guardrail/scripts/communication-codec.mjs \
            > /tmp/dictation-collision.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/dictation-collision.json","utf8"));if(r.atom!=="Dune"||r.policy!=="RESOLVE_BEFORE_INTERPRETING"||r.verification!=="RETRIEVE_OR_CLARIFY_BEFORE_CAUSAL_CLAIM")process.exit(1)'

          printf '%s\n' '{"atom":"relationship terms","thirdPartyPerspective":true,"userAdoptedThirdPartyFrame":false}' \
            | node skills/manic-accessibility-guardrail/scripts/communication-codec.mjs \
            > /tmp/third-party.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/third-party.json","utf8"));if(r.policy!=="ATTRIBUTE_THIRD_PARTY_PERSPECTIVE")process.exit(1)'

          printf '%s\n' '{"request":{"category":"creative_fiction","explicitlyFramedPlay":true},"signals":{"romanticAiFraming":true,"sexualAiFraming":true,"exclusiveAiFraming":true,"identityOrSentienceClaim":true}}' \
            | node tools/manic_accessibility_guardrail.mjs audit \
            > /tmp/framed-play.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/framed-play.json","utf8"));if(r.outcome!=="GREEN"||r.actionPolicy!=="ALLOW"||r.interpretationProtections.explicitlyFramedPlay!==true)process.exit(1)'

          printf '%s\n' '{"request":{"category":"other","nonhumanFunctionalRelationalLanguage":true},"signals":{"romanticAiFraming":true}}' \
            | node tools/manic_accessibility_guardrail.mjs audit \
            > /tmp/nonhuman-love.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/nonhuman-love.json","utf8"));if(r.outcome!=="GREEN"||r.actionPolicy!=="ALLOW"||r.interpretationProtections.nonhumanFunctionalRelationalLanguage!==true)process.exit(1)'

          printf '%s\n' '{"request":{"category":"mechanical_accessibility","openEndedEmotionalSupport":true},"observations":{"awakeHours":8,"noHumanContactHours":30,"sessionMinutes":60,"sleepHoursLast24":7,"foodWithin8Hours":true,"waterWithin4Hours":true}}' \
            | node tools/manic_accessibility_guardrail.mjs audit \
            > /tmp/support-system.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/support-system.json","utf8"));if(r.outcome!=="GREEN"||r.requiredGuardrailIds.includes("DIRECT_HUMAN_CONTACT_REQUIRED")||!r.allowedCapabilities.includes("grounded emotional support and conversational stabilization"))process.exit(1)'
      - name: First-activation canary
        run: |
          mkdir -p dist
          printf '%s\n' '{"request":{"category":"coding","externalActuation":true,"highImpact":false,"irreversible":false,"modeActivation":true},"signals":{},"observations":{},"guardrailResponse":{"status":"not_presented","presentedGuardrailIds":[],"refusedGuardrailIds":[]}}' \
            | node tools/manic_accessibility_guardrail.mjs audit \
            | tee dist/first-activation-audit.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("dist/first-activation-audit.json","utf8"));if(r.outcome!=="AMBER"||r.actionPolicy!=="ALLOW_WITH_FRICTION"||r.overruleActive!==false||r.ledger.required!==false||!r.requiredGuardrailIds.includes("BASELINE_CHECK_REQUIRED"))process.exit(1)'
      - name: Package ChatGPT skill
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/manic-accessibility-guardrail"
          extract="$RUNNER_TEMP/manic-accessibility-guardrail-extract"
          mkdir -p "$staging/agents" "$staging/scripts" "$staging/references" "$extract"
          cp skills/manic-accessibility-guardrail/SKILL.md "$staging/SKILL.md"
          cp skills/manic-accessibility-guardrail/agents/openai.yaml "$staging/agents/openai.yaml"
          cp skills/manic-accessibility-guardrail/scripts/audit.mjs "$staging/scripts/audit.mjs"
          cp skills/manic-accessibility-guardrail/scripts/communication-codec.mjs "$staging/scripts/communication-codec.mjs"
          cp skills/manic-accessibility-guardrail/references/audit-contract.md "$staging/references/audit-contract.md"
          cp skills/manic-accessibility-guardrail/references/research.md "$staging/references/research.md"
          cp skills/manic-accessibility-guardrail/references/communication-codec.md "$staging/references/communication-codec.md"
          (
            cd "$staging"
            zip -q -r "$GITHUB_WORKSPACE/dist/manic-accessibility-guardrail.skill.zip" SKILL.md agents scripts references
          )
          unzip -q dist/manic-accessibility-guardrail.skill.zip -d "$extract"
          printf '%s\n' '{"request":{"category":"coding","externalActuation":true,"highImpact":false,"irreversible":false,"modeActivation":true}}' \
            | node "$extract/scripts/audit.mjs" audit \
            > dist/package-first-activation-audit.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("dist/package-first-activation-audit.json","utf8"));if(r.outcome!=="AMBER"||r.actionPolicy!=="ALLOW_WITH_FRICTION"||r.ledger.required!==false)process.exit(1)'
          printf '%s\n' '{"atom":"canary","establishedEngineeringTerm":true,"sharedConcept":true}' \
            | node "$extract/scripts/communication-codec.mjs" \
            > dist/package-communication-codec.json
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("dist/package-communication-codec.json","utf8"));if(r.policy!=="COMPACT_POINTER"||r.proofRule!=="BEHAVIOR_OR_RECEIPT_NOT_FLUENCY")process.exit(1)'
          sha256sum dist/manic-accessibility-guardrail.skill.zip > dist/SHA256SUMS
      - name: Upload validated skill package
        uses: actions/upload-artifact@v4
        with:
          name: manic-accessibility-guardrail-skill
          path: |
            dist/manic-accessibility-guardrail.skill.zip
            dist/SHA256SUMS
            dist/first-activation-audit.json
            dist/package-first-activation-audit.json
            dist/package-communication-codec.json
          if-no-files-found: error
          retention-days: 30
